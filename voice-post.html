<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SELLBY | Voice Posting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/auth-guard.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f8fafc; color: #0f172a; min-height: 100vh; padding-bottom: 80px; }
        .page-wrap { max-width: 600px; margin: 20px auto 40px; padding: 0 16px 40px; }
        .card { background: #ffffff; border-radius: 24px; padding: 24px; box-shadow: 0 10px 30px rgba(124, 58, 237, 0.08); border: 1px solid #f1f5f9; margin-bottom: 20px; }
        .section-label { font-size: 16px; font-weight: 700; color: #1e293b; margin-bottom: 12px; display: block; }

        /* Box 2: Ad Details */
        .details-container { position: relative; }
        textarea { width: 100%; border: 2px solid #e2e8f0; border-radius: 16px; padding: 15px; padding-right: 50px; font-size: 15px; background: #f8fafc; min-height: 200px; outline: none; transition: all 0.2s; resize: none; }
        textarea:focus { border-color: #7c3aed; background: #fff; }
        .mic-btn-inline { position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%; border: none; background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%); color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(124, 58, 237, 0.3); transition: transform 0.2s; }
        .mic-btn-inline.recording { background: #ef4444; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .publish-action-area { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
        .publish-btn { width: 100%; background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%); color: #fff; border: none; border-radius: 16px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 10px 24px rgba(124, 58, 237, 0.25); transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .publish-btn:hover { box-shadow: 0 12px 28px rgba(124, 58, 237, 0.35); }
        .publish-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-msg { margin-top: 6px; text-align: center; font-size: 13px; font-weight: 500; color: #64748b; }
    </style>
</head>
<body>

    <header class="header">
        <button class="back-btn-small" onclick="history.back()">←</button>
        <div class="page-title">
            <h1 data-i18n="voice_posting">Voice Posting</h1>
        </div>
    </header>

    <main class="page-wrap">
        <!-- Box 1: Photos (Master UI Image Uploader) -->
        <section class="card">
            <div class="photo-section-header">
                <h3 class="photo-section-title" data-i18n="add_photos">Add Photos</h3>
                <button id="addImgHeaderBtn" type="button" class="add-img-header-btn" onclick="document.getElementById('photos').click()">
                    <span>+</span> Add Image
                </button>
            </div>

            <div class="upload-container-box">
                <input type="file" id="photos" name="photos" multiple accept="image/*" style="display: none;">
                
                <div id="imageGrid" class="upload-image-grid">
                    <div class="add-tile" onclick="document.getElementById('photos').click()">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                        <span>Add Image</span>
                    </div>
                </div>

                <div class="upload-box-footer">
                    <span class="img-count-text"><strong id="currentImgCount">0</strong> / 10 images selected</span>
                    <span class="img-count-hint">You can upload up to 10 images</span>
                </div>
            </div>
        </section>

        <!-- Box 2: Ad Details -->
        <section class="card">
            <label class="section-label" data-i18n="ad_details_voice">Ad Details</label>
            <div class="details-container">
                <textarea id="adDescription" data-i18n="desc_placeholder" placeholder="Tap the microphone and speak, or type your ad details..."></textarea>
                <button id="micBtn" class="mic-btn-inline" title="Speak to write description">🎤</button>
            </div>

            <div class="publish-action-area">
                <button id="publishBtn" class="publish-btn" data-i18n="publish">Publish</button>
                <div id="statusMessage" class="status-msg"></div>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/voice-post.js"></script>
</body>
</html>
