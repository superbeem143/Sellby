<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>SELLBY - Post Your Ad</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/auth-guard.js"></script>

</head>

<body class="post-ad-body">

    <!-- HEADER -->
    <header class="post-ad-header">
        <button class="back-btn-small" onclick="history.back()">←</button>
        <h1 class="post-ad-title">Post Your Ad</h1>
        <button id="saveDraftBtn" type="button" class="save-draft-btn">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            <span>Save Draft</span>
        </button>
    </header>

    <main class="post-ad-wrap">
        <form id="postPropertyForm" class="post-ad-card" onsubmit="return false;">

            <!-- AD PHOTO SECTION -->
            <div class="photo-section-header">
                <h3 class="photo-section-title" data-i18n="add_photos">Ad Photo</h3>
                <button id="addImgHeaderBtn" type="button" class="add-img-header-btn" onclick="document.getElementById('photos').click()">
                    <span>+</span> Add Image
                </button>
            </div>

            <!-- IMAGE UPLOAD CONTAINER BOX -->
            <div class="upload-container-box">
                <input type="file" id="photos" name="photos" multiple accept="image/*" style="display: none;">
                
                <div id="imageGrid" class="upload-image-grid">
                    <div class="add-tile" onclick="document.getElementById('photos').click()">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                        <span>Add Image</span>
                    </div>
                </div>

                <div class="upload-box-footer">
                    <span class="img-count-text"><strong id="currentImgCount">0</strong> / 10 images selected</span>
                    <span class="img-count-hint">You can upload up to 10 images</span>
                </div>
            </div>

            <!-- FORM FIELDS -->
            <div class="form-fields-grid">

                <!-- Title -->
                <div class="form-group full-width">
                    <label for="title">Property Title <span class="required">*</span></label>
                    <input id="title" name="title" type="text" placeholder="Enter property title" required>
                </div>

                <!-- Type & Layout Name -->
                <div class="form-group">
                    <label for="type">Property Type <span class="required">*</span></label>
                    <select id="type" name="type" required>
                        <option value="">Select property type</option>
                        <option value="Apartment">Apartment</option>
                        <option value="Independent House">Independent House</option>
                        <option value="Plot / Land">Plot / Land</option>
                        <option value="Villa">Villa</option>
                        <option value="Commercial">Office / Commercial</option>
                        <option value="PG / Hostel">PG / Hostel</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="layoutName">Layout Name</label>
                    <input id="layoutName" name="layoutName" type="text" placeholder="Enter layout name">
                </div>

                <!-- Price & Price per Sq.Yard -->
                <div class="form-group">
                    <label for="price">Price <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <span class="input-prefix">₹</span>
                        <input id="price" name="price" type="number" placeholder="Enter price" min="0" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="pricePerSqYard">Price per Sq.Yard</label>
                    <div class="input-with-icon">
                        <span class="input-prefix">₹</span>
                        <input id="pricePerSqYard" name="pricePerSqYard" type="number" placeholder="Enter price per sq.yard" min="0">
                    </div>
                </div>

                <!-- Total Area & Facing -->
                <div class="form-group">
                    <label for="totalArea">Total Area <span class="required">*</span></label>
                    <div class="input-with-unit">
                        <input id="totalArea" name="totalArea" type="text" placeholder="Enter total area" required>
                        <select id="areaUnit" class="unit-select">
                            <option value="Sq.Yards">Sq.Yards</option>
                            <option value="Sq.Ft">Sq.Ft</option>
                            <option value="Acres">Acres</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="facing">Facing <span class="required">*</span></label>
                    <select id="facing" name="facing" required>
                        <option value="">Select facing</option>
                        <option value="East">East</option>
                        <option value="West">West</option>
                        <option value="North">North</option>
                        <option value="South">South</option>
                        <option value="North-East">North-East</option>
                        <option value="North-West">North-West</option>
                        <option value="South-East">South-East</option>
                        <option value="South-West">South-West</option>
                    </select>
                </div>

                <!-- Location -->
                <div class="form-group full-width">
                    <label for="location">Location <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <span class="input-prefix">📍</span>
                        <input id="location" name="location" type="text" placeholder="Enter property location" required>
                    </div>
                </div>

                <!-- Description -->
                <div class="form-group full-width">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" placeholder="Describe the property, amenities, and nearby points of interest"></textarea>
                </div>

            </div>

            <!-- SUBMIT ACTION -->
            <div class="submit-action-area">
                <div id="statusMessage" class="status-message">1 Photo + Price + Title required.</div>
                <button id="publishBtn" class="publish-submit-btn" type="button">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                    <span>Preview Ad</span>
                </button>
            </div>

        </form>
    </main>

    <!-- ================= FIREBASE ================= -->
    <script type="module" src="js/firebase-config.js"></script>

    <!-- ================= POST PROPERTY JS ================= -->
    <script type="module" src="js/post-property.js"></script>

</body>

</html>
