<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SELLBY - Post Property</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#0057D9;
color:white;
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
padding:15px;
}

.card{
background:white;
border-radius:18px;
padding:18px;
box-shadow:0 3px 12px rgba(0,0,0,.15);
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-size:15px;
font-weight:bold;
color:#333;
}

input,
textarea{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
outline:none;
}

textarea{
height:120px;
resize:none;
}

.publish-btn{
width:100%;
margin-top:25px;
padding:15px;
border:none;
border-radius:12px;
background:#FFC107;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<header>
Post Property
</header>

<div class="container">

<div class="card">

<label>Upload Photos</label>
<input type="file" multiple accept="image/*">

<label>Property Title</label>
<input type="text" placeholder="Enter Property Title">
<label>Price</label>
<input type="number" placeholder="Enter Price">

<label>Location</label>
<input type="text" placeholder="City / Area / Village">

<label>Voice Description</label>

<button type="button" class="publish-btn" style="background:#2196F3; margin-top:10px;">
🎤 Start Voice
</button>

<label>Description</label>

<textarea placeholder="Your voice will be converted to text here..."></textarea>

<button class="publish-btn">
Publish Property
</button>
</div>

</div>

<script type="module" src="js/
firebase-config.js"></script>
<script type="module" src="js/
post-property.js"></script>

</body>
</html>
