<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SELLBY - Post Property</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    body {
      background: #eef2f7;
      color: #1f2937;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #0f4cff, #1b6bff);
      color: #fff;
      padding: 24px 20px;
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 0 12px 24px rgba(15, 76, 255, 0.16);
    }

    .page-wrap {
      max-width: 940px;
      margin: -32px auto 32px;
      padding: 0 16px 48px;
    }

    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 18px 45px rgba(31, 41, 55, 0.08);
      overflow: hidden;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      font-size: 15px;
      font-weight: 600;
      color: #334155;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 15px;
      background: #f8fafc;
      color: #0f172a;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      background: #ffffff;
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    .upload-field {
      display: grid;
      gap: 12px;
    }

    .hint {
      font-size: 13px;
      color: #64748b;
    }

    .image-preview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .preview-thumb {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background: #e2e8f0;
      min-height: 88px;
    }

    .preview-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-count {
      font-size: 14px;
      color: #334155;
      margin-top: 4px;
    }

    .submit-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 28px;
      align-items: center;
      justify-content: space-between;
    }

    .publish-btn {
      background: #0f4cff;
      color: white;
      border: none;
      border-radius: 16px;
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 14px 30px rgba(15, 76, 255, 0.18);
    }

    .publish-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 34px rgba(15, 76, 255, 0.24);
    }

    .status-message {
      flex: 1;
      font-size: 14px;
      color: #475569;
    }

    @media (max-width: 760px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .page-wrap {
        margin-top: 0;
      }
    }
  </style>
</head>
<body>
  <header>Post Property</header>
  <main class="page-wrap">
    <section class="card">
      <div class="form-grid">
        <div class="form-group upload-field">
          <label for="photos">Upload Photos</label>
          <input id="photos" name="photos" type="file" multiple accept="image/*">
          <span class="hint">Upload up to 10 images. JPEG, PNG, and WebP supported.</span>
          <div class="image-preview" id="imagePreview"></div>
          <div class="preview-count" id="previewCount">0 / 10 images selected</div>
        </div>

        <div class="form-group">
          <label for="title">Property Title</label>
          <input id="title" name="title" type="text" placeholder="Example: Spacious 3BHK in downtown" required>
        </div>

        <div class="form-group">
          <label for="price">Price</label>
          <input id="price" name="price" type="number" placeholder="Enter price in rupees" min="0" required>
        </div>

        <div class="form-group">
          <label for="type">Property Type</label>
          <select id="type" name="type" required>
            <option value="">Select property type</option>
            <option>Apartment</option>
            <option>Independent House</option>
            <option>Plot / Land</option>
            <option>Villa</option>
            <option>Office / Commercial</option>
            <option>PG / Hostel</option>
          </select>
        </div>

        <div class="form-group">
          <label for="location">Location</label>
          <input id="location" name="location" type="text" placeholder="City, area, or landmark" required>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" placeholder="Describe the property, amenities, and nearby points of interest" required></textarea>
        </div>

        <div class="form-group">
          <label for="contactNumber">Contact Number</label>
          <input id="contactNumber" name="contactNumber" type="tel" placeholder="Enter your phone number" pattern="[0-9+\- ]*" required>
        </div>

        <div class="form-group">
          <label for="whatsappNumber">WhatsApp Number</label>
          <input id="whatsappNumber" name="whatsappNumber" type="tel" placeholder="Enter WhatsApp number" pattern="[0-9+\- ]*">
        </div>
      </div>

      <div class="submit-row">
        <div class="status-message" id="statusMessage">All fields are required except WhatsApp number. Images will be uploaded automatically.</div>
        <button id="publishBtn" class="publish-btn" type="button">Publish Property</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/post-property.js"></script>
</body>
</html>
