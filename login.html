<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SELLBY | Login</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <!-- SELLBY BRAND -->

            <h1>SELLBY</h1>

            <p>
                Sell Easy. Buy Easy.
            </p>


            <!-- ================= LOGIN ================= -->

            <div id="phoneLoginSection">

                <h2>Login or Register</h2>

                <p>
                    Enter your mobile number to receive
                    a verification code via SMS.
                </p>


                <!-- PHONE NUMBER -->

                <div class="form-group">

                    <label for="phoneNumber">
                        Mobile Number
                    </label>

                    <input
                        id="phoneNumber"
                        type="tel"
                        placeholder="+91 9876543210"
                        autocomplete="tel"
                        maxlength="15">

                </div>


                <!-- RECAPTCHA -->

                <div
                    id="recaptcha-container">
                </div>


                <!-- CONTINUE -->

                <button
                    id="sendOtpBtn"
                    class="publish-btn"
                    type="button">

                    Continue

                </button>

            </div>


            <!-- ================= OTP ================= -->

            <div
                id="otpSection"
                style="display:none;">

                <h2>Verify Mobile Number</h2>

                <p>
                    Enter the verification code sent
                    to your mobile number.
                </p>


                <div class="form-group">

                    <label for="otpCode">
                        Verification Code
                    </label>

                    <input
                        id="otpCode"
                        type="text"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        placeholder="Enter 6-digit OTP"
                        maxlength="6">

                </div>


                <button
                    id="verifyOtpBtn"
                    class="publish-btn"
                    type="button">

                    Verify & Continue

                </button>


                <button
                    id="backBtn"
                    type="button">

                    Change Number

                </button>

            </div>


            <!-- STATUS -->

            <p
                id="statusMessage"
                class="status-message">
            </p>

        </section>

    </main>


    <!-- FIREBASE CONFIG -->

    <script
        type="module"
        src="js/firebase-config.js">
    </script>


    <!-- LOGIN -->

    <script
        type="module"
        src="js/login.js">
    </script>

</body>

</html>
