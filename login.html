<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>SELLBY | Mobile Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           SELLBY LOGIN UI
           UI ONLY — DO NOT CHANGE AUTHENTICATION
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: "Poppins", sans-serif;
            color: #172033;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(124,58,237,.12),
                    transparent 38%
                ),
                radial-gradient(
                    circle at top right,
                    rgba(219,39,119,.10),
                    transparent 35%
                ),
                #f8f9fd;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           PAGE
           ===================================================== */

        .auth-page {
            min-height: 100dvh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 14px;
        }

        /* =====================================================
           CARD
           ===================================================== */

        .auth-card {
            width: 100%;
            max-width: 430px;
            background: rgba(255,255,255,.96);
            border: 1px solid rgba(124,58,237,.10);
            border-radius: 28px;
            padding: 30px 24px 24px;
            box-shadow:
                0 25px 60px rgba(37,25,75,.10),
                0 5px 20px rgba(124,58,237,.06);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(
                90deg,
                #7c3aed,
                #a855f7,
                #db2777
            );
        }

        /* =====================================================
           BRAND
           ===================================================== */

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-brand-logo {
            font-size: 38px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 8px;
        }

        .logo-sell {
            color: #6d28d9;
        }

        .logo-by {
            background: linear-gradient(
                135deg,
                #db2777,
                #ec4899
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .auth-tagline {
            font-size: 12px;
            color: #7b8495;
            font-weight: 500;
            letter-spacing: .2px;
        }

        /* =====================================================
           FORM STEP
           ===================================================== */

        .form-step {
            width: 100%;
            animation: fadeIn .25s ease;
        }

        .form-step.hidden {
            display: none;
        }

        .auth-card-title {
            font-size: 23px;
            font-weight: 700;
            color: #172033;
            margin-bottom: 8px;
        }

        .auth-card-subtitle {
            font-size: 13px;
            line-height: 1.6;
            color: #7b8495;
            margin-bottom: 22px;
        }

        .target-phone-highlight {
            color: #6d28d9;
            font-weight: 700;
        }

        /* =====================================================
           PHONE INPUT
           ===================================================== */

        .phone-input-wrapper {
            width: 100%;
            height: 58px;
            display: flex;
            align-items: stretch;
            background: #f8f9fc;
            border: 1.8px solid #e3e6ee;
            border-radius: 17px;
            overflow: hidden;
            transition: .2s ease;
            margin-bottom: 18px;
        }

        .phone-input-wrapper:focus-within {
            background: #fff;
            border-color: #7c3aed;
            box-shadow:
                0 0 0 4px rgba(124,58,237,.10);
        }

        /* =====================================================
           COUNTRY SELECT
           ===================================================== */

        .country-code-select {
            width: 96px;
            min-width: 96px;
            height: 100%;
            border: 0;
            outline: none;
            background: #f1f3f8;
            border-right: 1px solid #e1e4ec;
            color: #263044;
            font-size: 15px;
            font-weight: 600;
            padding: 0 8px;
            cursor: pointer;
            appearance: auto;
        }

        .country-code-select:focus {
            background: #ecebff;
        }

        /* =====================================================
           MOBILE NUMBER
           ===================================================== */

        .phone-input {
            flex: 1;
            min-width: 0;
            height: 100%;
            border: 0;
            outline: none;
            background: transparent;
            color: #172033;
            font-size: 17px;
            font-weight: 600;
            padding: 0 16px;
            letter-spacing: .5px;
        }

        .phone-input::placeholder {
            color: #a1a8b5;
            font-size: 14px;
            font-weight: 400;
        }

        /* =====================================================
           SELLBY BUTTON
           ===================================================== */

        .gradient-btn {
            width: 100%;
            min-height: 55px;
            border: 0;
            border-radius: 17px;
            background:
                linear-gradient(
                    135deg,
                    #7c3aed 0%,
                    #a855f7 45%,
                    #db2777 100%
                );
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow:
                0 10px 24px rgba(124,58,237,.25);
            transition:
                transform .18s ease,
                box-shadow .18s ease,
                opacity .18s ease;
        }

        .gradient-btn:hover {
            transform: translateY(-1px);
            box-shadow:
                0 14px 30px rgba(124,58,237,.30);
        }

        .gradient-btn:active {
            transform: scale(.98);
        }

        .gradient-btn:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
        }

        /* =====================================================
           OTP
           ===================================================== */

        .otp-container {
            width: 100%;
            display: grid;
            grid-template-columns:
                repeat(6, minmax(0, 1fr));
            gap: 8px;
            margin: 25px 0 20px;
        }

        .otp-field {
            width: 100%;
            min-width: 0;
            height: 55px;
            border: 2px solid #e4e7ef;
            border-radius: 14px;
            background: #f8f9fc;
            outline: none;
            text-align: center;
            color: #6d28d9;
            font-size: 22px;
            font-weight: 700;
            transition: .18s ease;
        }

        .otp-field:focus {
            background: #fff;
            border-color: #a855f7;
            box-shadow:
                0 0 0 4px rgba(168,85,247,.10);
            transform: translateY(-2px);
        }

        .otp-field.filled {
            background: #f5f0ff;
            border-color: #7c3aed;
        }

        /* =====================================================
           OTP BOTTOM ROW
           ===================================================== */

        .otp-meta-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 18px;
        }

        .change-num-btn {
            border: 0;
            background: transparent;
            color: #6d28d9;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 0;
            white-space: nowrap;
        }

        .change-num-btn:hover {
            color: #db2777;
        }

        .timer-badge {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 7px;
            font-size: 12px;
            color: #7b8495;
            white-space: nowrap;
        }

        #timerCountdown {
            font-weight: 600;
        }

        #timerCountdown strong {
            color: #7c3aed;
            font-weight: 700;
        }

        .resend-btn {
            border: 0;
            background: transparent;
            color: #db2777;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 0;
        }

        .resend-btn:disabled {
            color: #b9bfca;
            cursor: not-allowed;
        }

        /* =====================================================
           STATUS
           ===================================================== */

        .auth-status-msg {
            width:
