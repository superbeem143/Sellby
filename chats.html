<!-- ===================================================== -->
<!--                 SELLBY CHATS.HTML                    -->
<!--                    HTML PART 1                       -->
<!-- ===================================================== -->

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SELLBY | Chats</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:'Poppins',sans-serif;

}

body{

background:#f5f7fb;

}

.header{

height:65px;

background:#0057D9;

color:#fff;

display:flex;

align-items:center;

padding:0 18px;

font-size:22px;

font-weight:600;

}

.search-box{

padding:15px;

background:#fff;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}

.search-box input{

width:100%;

padding:13px;

border:1px solid #ddd;

border-radius:12px;

outline:none;

font-size:15px;

}

.chat-list{

padding:10px;

}

</style>

</head>

<body>

<div class="header">

💬 Chats

</div>

<div class="search-box">

<input

id="searchInput"

type="text"

placeholder="Search chats...">

</div>

<div

id="chatList"

class="chat-list">
<!-- ===================================================== -->
<!--                 SELLBY CHATS.HTML                    -->
<!--                    HTML PART 2                       -->
<!-- ===================================================== -->

<div
id="loadingMessage"
style="
text-align:center;
padding:40px;
color:#666;
">

Loading Chats...

</div>

<div
id="emptyState"
style="
display:none;
text-align:center;
padding:50px 20px;
color:#666;
">

<div
style="
font-size:60px;
margin-bottom:15px;
">

💬

</div>

<h2>

No Chats Yet

</h2>

<p>

Your conversations will appear here.

</p>

</div>

</div>

<style>

.chat-item{

display:flex;

align-items:center;

gap:15px;

background:#fff;

padding:15px;

border-radius:16px;

margin-bottom:12px;

box-shadow:0 2px 10px rgba(0,0,0,.08);

cursor:pointer;

transition:.2s;

position:relative;

}

.chat-item.unread{

background:#eef5ff;

border-left:4px solid #0057D9;

}

.unread-dot{

width:12px;

height:12px;

background:#ff4d4d;

border-radius:50%;

margin-left:auto;

flex-shrink:0;

}

.chat-item:hover{

transform:translateY(-2px);

}

.avatar{

width:55px;

height:55px;

border-radius:50%;

background:#0057D9;

color:#fff;

display:flex;

align-items:center;

justify-content:center;

font-size:22px;

font-weight:600;

}

.chat-info{

flex:1;

}

.chat-name{

font-size:17px;

font-weight:600;

margin-bottom:4px;

}

.last-message{

color:#666;

font-size:14px;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}

.chat-time{

font-size:12px;

color:#999;

}

</style>
<!-- ===================================================== -->
<!--                 SELLBY CHATS.HTML                    -->
<!--                    HTML PART 3                       -->
<!-- ===================================================== -->

<script
type="module"
src="js/firebase-config.js">

</script>

<script
type="module"
src="js/chats.js">

</script>

</body>

</html>
