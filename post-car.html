<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>SELLBY - Post Your Car</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/auth-guard.js"></script>

</head>

<body class="post-ad-body">

    <!-- HEADER -->
    <header class="post-ad-header">
        <button class="back-btn-small" onclick="history.back()">←</button>
        <h1 class="post-ad-title">Post Your Car</h1>
        <button id="saveDraftBtn" type="button" class="save-draft-btn">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            <span>Save Draft</span>
        </button>
    </header>

    <main class="post-ad-wrap">
        <form id="postCarForm" class="post-ad-card" onsubmit="return false;">

            <!-- AD PHOTO SECTION -->
            <div class="photo-section-header">
                <h3 class="photo-section-title" data-i18n="add_photos">Ad Photo</h3>
                <button id="addImgHeaderBtn" type="button" class="add-img-header-btn" onclick="document.getElementById('photos').click()">
                    <span>+</span> Add Image
                </button>
            </div>

            <!-- IMAGE UPLOAD CONTAINER BOX -->
            <div class="upload-container-box">
                <input type="file" id="photos" name="photos" multiple accept="image/*" style="display: none;">
                
                <div id="imageGrid" class="upload-image-grid">
                    <div class="add-tile" onclick="document.getElementById('photos').click()">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                        <span>Add Image</span>
                    </div>
                </div>

                <div class="upload-box-footer">
                    <span class="img-count-text"><strong id="currentImgCount">0</strong> / 10 images selected</span>
                    <span class="img-count-hint">You can upload up to 10 images</span>
                </div>
            </div>

            <!-- FORM FIELDS -->
            <div class="form-fields-grid">

                <div class="form-group">
                    <label for="brand" data-i18n="brand">Car Brand <span class="required">*</span></label>
                    <input id="brand" name="brand" type="text" placeholder="Example: Maruti Suzuki" required>
                </div>

                <div class="form-group">
                    <label for="model" data-i18n="model">Car Model <span class="required">*</span></label>
                    <input id="model" name="model" type="text" placeholder="Example: Swift VXI" required>
                </div>

                <div class="form-group">
                    <label for="year" data-i18n="year">Year <span class="required">*</span></label>
                    <input id="year" name="year" type="number" placeholder="Example: 2022" required>
                </div>

                <div class="form-group">
                    <label for="fuel">Fuel Type <span class="required">*</span></label>
                    <select id="fuel" name="fuel" required>
                        <option value="">Select Fuel Type</option>
                        <option value="Petrol">Petrol</option>
                        <option value="Diesel">Diesel</option>
                        <option value="CNG">CNG</option>
                        <option value="Electric">Electric</option>
                        <option value="Hybrid">Hybrid</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="transmission">Transmission <span class="required">*</span></label>
                    <select id="transmission" name="transmission" required>
                        <option value="">Select Transmission</option>
                        <option value="Manual">Manual</option>
                        <option value="Automatic">Automatic</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="kms" data-i18n="kms">KM Driven <span class="required">*</span></label>
                    <input id="kms" name="kms" type="number" placeholder="Example: 35000" required>
                </div>

                <div class="form-group">
                    <label for="price" data-i18n="price">Price <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <span class="input-prefix">₹</span>
                        <input id="price" name="price" type="number" placeholder="Enter Price" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="location" data-i18n="location">Location <span class="required">*</span></label>
                    <div class="input-with-icon">
                        <span class="input-prefix">📍</span>
                        <input id="location" name="location" type="text" placeholder="City, Area or Landmark" required>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="description" data-i18n="description">Description</label>
                    <textarea id="description" name="description" placeholder="Describe your car..."></textarea>
                </div>

            </div>

            <!-- SUBMIT ACTION -->
            <div class="submit-action-area">
                <div id="statusMessage" class="status-message">1 Photo + Price + Brand/Model required.</div>
                <button id="publishBtn" class="publish-submit-btn" type="button">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                    <span>Publish Car</span>
                </button>
            </div>

        </form>
    </main>

    <!-- ================= FIREBASE ================= -->
    <script type="module" src="js/firebase-config.js"></script>

    <!-- ================= POST CAR JS ================= -->
    <script type="module" src="js/post-car.js"></script>

</body>

</html>
