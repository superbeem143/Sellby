<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SELLBY | Mobiles</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <button
            class="back-btn"
            onclick="history.back()">

            ←

        </button>

        <div class="page-title">

            <h1>

                Mobiles

            </h1>

            <p>

                Buy & Sell Mobiles Easily

            </p>

        </div>

    </header>

    <!-- ================= SEARCH ================= -->

    <section class="search-section">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search Mobiles...">

            <button>

                🔍

            </button>

        </div>

    </section>

    <!-- ================= MOBILE LIST ================= -->

    <main class="cars-page">

        <div
            id="loadingMessage"
            class="loading-message">

            Loading mobiles...

        </div>

        <div
            id="mobileList"
            class="car-list">

        </div>
