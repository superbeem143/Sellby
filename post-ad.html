<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SELLBY - Choose Category</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#0057D9;
color:#fff;
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
padding:20px;
}

.title{
text-align:center;
font-size:22px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:25px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.card{
background:#fff;
border-radius:18px;
padding:20px;
text-align:center;
text-decoration:none;
color:#000;
box-shadow:0 3px 10px rgba(0,0,0,.12);
transition:.2s;
}

.card:hover{
transform:scale(1.03);
}

.icon{
font-size:42px;
margin-bottom:10px;
}

.name{
font-size:18px;
font-weight:bold;
}

</style>
</head>

<body>

<header>
SELLBY
</header>

<div class="container">

<div class="title">
What do you want to sell?
</div>

<div class="subtitle">
Choose a category
</div>

<div class="grid">
<a href="post-property.html" class="card">
    <div class="icon">🏡</div>
    <div class="name">Property</div>
</a>

<a href="post-car.html" class="card">
    <div class="icon">🚗</div>
    <div class="name">Cars</div>
</a>

<a href="post-bike.html" class="card">
    <div class="icon">🏍️</div>
    <div class="name">Bikes</div>
</a>

<a href="post-mobile.html" class="card">
    <div class="icon">📱</div>
    <div class="name">Mobiles</div>
</a>

<a href="post-electronics.html" class="card">
    <div class="icon">💻</div>
    <div class="name">Electronics</div>
</a>

<a href="post-furniture.html" class="card">
    <div class="icon">🪑</div>
    <div class="name">Furniture</div>
</a>

<a href="post-others.html" class="card">
    <div class="icon">📦</div>
    <div class="name">Others</div>
</a>
</div>

</div>

</body>
</html>
