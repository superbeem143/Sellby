<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELLBY | Others</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/auth-guard.js"></script>
</head>
<body>
    <header class="category-header">
        <button class="back-btn-small" onclick="history.back()">←</button>
        <div class="category-title-area">
            <h1 data-i18n="cat_others">Others</h1>
            <p data-i18n="app_name">Buy & Sell Everything Else</p>
        </div>
    </header>

    <section class="search-section">
        <div class="search-box">
            <svg class="search-btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" placeholder="Search Items...">
        </div>
    </section>

    <main class="container">
        <div id="othersList" class="featured-grid">
            <!-- Other ads will load here -->
        </div>
        <div class="loading" id="loadingMessage" style="text-align: center; margin-top: 20px; color: #64748b;">Loading items...</div>
    </main>

    <a href="post-others.html" class="floating-post-btn">
        <span class="plus-icon">
            <svg class="plus-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </span>
        <span class="floating-text">Sell</span>
    </a>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/others.js"></script>
</body>
</html>
