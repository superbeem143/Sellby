<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELLBY | Mobile Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="auth-page">
        <section class="auth-card">
            
            <!-- SELLBY BRAND LOGO & TAGLINE -->
            <header class="auth-header">
                <h1 class="auth-brand-logo">
                    <span class="logo-sell">SELL</span><span class="logo-by">BY</span>
                </h1>
                <p class="auth-tagline">
                    Sell Easy. Buy Easy.
                </p>
            </header>

            <!-- STEP 1: MOBILE NUMBER ENTRY -->
            <div id="phoneStep" class="form-step">
                <h2 class="auth-card-title" data-i18n="login_or_register">Login or Register</h2>
                <p class="auth-card-subtitle" data-i18n="enter_mobile">
                    Enter your mobile number to receive a verification code via SMS.
                </p>

                <div class="phone-input-wrapper">
                    <select id="countryCode" class="country-code-select" aria-label="Country Code">
                        <option value="+91">🇮🇳 +91</option>
                        <option value="+1">🇺🇸 +1</option>
                        <option value="+44">🇬🇧 +44</option>
                        <option value="+971">🇦🇪 +971</option>
                    </select>
                    <input 
                        id="mobileNumber" 
                        type="tel" 
                        class="phone-input" 
                        data-i18n="phone_placeholder"
                        placeholder="Enter mobile number"
                        maxlength="10"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        autocomplete="tel-national"
                        required>
                </div>

                <button id="sendOtpBtn" class="gradient-btn" type="button">
                    <span data-i18n="continue">Continue</span>
                </button>
            </div>

            <!-- STEP 2: OTP VERIFICATION -->
            <div id="otpStep" class="form-step hidden">
                <h2 class="auth-card-title" data-i18n="enter_code">Enter verification code</h2>
                <p class="auth-card-subtitle">
                    <span data-i18n="code_sent">Code sent to</span> <span id="displayPhoneNumber" class="target-phone-highlight">+91 00000 00000</span>
                </p>

                <div class="otp-container">
                    <input type="text" maxlength="1" class="otp-field" id="otp-1" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" />
                    <input type="text" maxlength="1" class="otp-field" id="otp-2" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" />
                    <input type="text" maxlength="1" class="otp-field" id="otp-3" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" />
                    <input type="text" maxlength="1" class="otp-field" id="otp-4" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" />
                    <input type="text" maxlength="1" class="otp-field" id="otp-5" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" />
                    <input type="text" maxlength="1" class="otp-field" id="otp-6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" />
                </div>

                <button id="verifyOtpBtn" class="gradient-btn" type="button">
                    <span data-i18n="verify_code">Verify Code</span>
                </button>

                <div class="otp-meta-row">
                    <button id="changeNumberBtn" class="change-num-btn" type="button" data-i18n="change_number">
                        ← Change number
                    </button>
                    
                    <div class="timer-badge">
                        <button id="resendOtpBtn" class="resend-btn" type="button" disabled data-i18n="resend_otp">Resend OTP</button>
                        <span id="timerCountdown">in <strong>30s</strong></span>
                    </div>
                </div>
            </div>

            <!-- RECAPTCHA CONTAINER (INVISIBLE) -->
            <div id="recaptcha-container"></div>

            <!-- STATUS & ERROR MESSAGES -->
            <div id="statusMessage" class="auth-status-msg" role="alert"></div>

        </section>
    </main>

    <!-- FIREBASE SERVICES -->
    <script type="module" src="js/firebase-config.js"></script>

    <!-- LOGIN SCRIPT -->
    <script type="module" src="js/login.js"></script>

</body>
</html>
