<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SELLBY | Chat</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f7fb;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }


        /* ================= HEADER ================= */

        .chat-header {
            height: 65px;
            min-height: 65px;
            background: #0057D9;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }


        .back-btn {
            border: none;
            background: transparent;
            color: white;
            font-size: 28px;
            cursor: pointer;
            width: 40px;
            height: 40px;
        }


        .chat-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .chat-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }


        .chat-user h2 {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.2;
        }


        .chat-user p {
            font-size: 11px;
            margin-top: 2px;
            opacity: 0.9;
        }


        /* ================= MESSAGES ================= */

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #eef3fb;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }


        .message {
            max-width: 78%;
            padding: 10px 13px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.45;
            word-break: break-word;
        }


        .message.sent {
            align-self: flex-end;
            background: #0057D9;
            color: white;
            border-bottom-right-radius: 4px;
        }


        .message.received {
            align-self: flex-start;
            background: white;
            color: #222;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 7px rgba(0,0,0,0.08);
        }


        .message-text {
            white-space: pre-wrap;
        }


        .message-time {
            font-size: 9px;
            margin-top: 4px;
            opacity: 0.7;
            text-align: right;
        }


        /* ================= FOOTER ================= */

        .chat-footer {
            min-height: 68px;
            padding: 10px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 8px;
        }


        .chat-input {
            flex: 1;
            min-width: 0;
            height: 46px;
            border: 1px solid #ddd;
            border-radius: 24px;
            outline: none;
            padding: 0 16px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
        }


        .chat-input:focus {
            border-color: #0057D9;
        }


        .send-btn {
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 50%;
            background: #0057D9;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }


        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .chat-header {
                height: 62px;
                min-height: 62px;
            }


            .chat-messages {
                padding: 12px;
            }


            .message {
                max-width: 82%;
                font-size: 14px;
            }


            .chat-footer {
                padding: 9px;
            }


            .chat-input {
                font-size: 14px;
            }

        }

    </style>

</head>


<body>


    <!-- ================================================= -->
    <!--                    CHAT HEADER                    -->
    <!-- ================================================= -->

    <header class="chat-header">


        <button
            class="back-btn"
            type="button"
            onclick="history.back()">

            ←

        </button>


        <div class="chat-user">


            <div class="chat-avatar">

                👤

            </div>


            <div>

                <h2 id="sellerName">

                    Seller

                </h2>


                <p id="sellerStatus">

                    🟢 Online

                </p>

            </div>

        </div>

    </header>



    <!-- ================================================= -->
    <!--                  CHAT MESSAGES                    -->
    <!-- ================================================= -->

    <main
        id="chatMessages"
        class="chat-messages">

    </main>



    <!-- ================================================= -->
    <!--                  MESSAGE INPUT                    -->
    <!-- ================================================= -->

    <footer class="chat-footer">


        <input
            id="messageInput"
            class="chat-input"
            type="text"
            placeholder="Type a message..."
            autocomplete="off">


        <button
            id="sendBtn"
            class="send-btn"
            type="button">

            ➤

        </button>


    </footer>



    <!-- ================================================= -->
    <!--                  FIREBASE CONFIG                  -->
    <!-- ================================================= -->

    <script
        type="module"
        src="firebase-config.js">
    </script>



    <!-- ================================================= -->
    <!--                     CHAT JS                       -->
    <!-- ================================================= -->

    <script
        type="module"
        src="chat.js">
    </script>


</body>

</html>
