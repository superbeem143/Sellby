<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SELLBY | My Ads</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

    <script type="module" src="js/auth-guard.js"></script>

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">
        <button class="back-btn" onclick="history.back()" data-i18n="back">←</button>
        <div class="page-title">
            <h1 data-i18n="my_ads">My Ads</h1>
            <p data-i18n="post_hint">Your posted marketplace listings</p>
        </div>
    </header>

    <main class="saved-page">
        <div id="loadingMessage" class="loading-message" data-i18n="loading">Loading your ads...</div>
        <div id="myAdsList" class="saved-list"></div>
        <div id="emptyState" class="empty-state" style="display:none;">
            <h2 data-i18n="no_ads_yet">📋 No Ads Posted</h2>
            <p data-i18n="empty_desc">You haven't posted any ads yet.</p>
            <a href="index.html" class="publish-btn" data-i18n="browse_categories">Browse Ads</a>
        </div>
    </main>

    <!-- ================= FIREBASE ================= -->

    <script
        type="module"
        src="js/firebase-config.js">
    </script>

    <!-- ================= MY ADS JS ================= -->

    <script
        type="module"
        src="js/my-ads.js">
    </script>

</body>

</html>
