<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SELLBY | Chats</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<script type="module" src="js/auth-guard.js"></script>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:'Poppins',sans-serif;

}

body{

background:#f8fafc;

}

.header{

height:65px;

background:linear-gradient(135deg, #6d28d9, #db2777);

color:#fff;

display:flex;

align-items:center;

padding:0 18px;

font-size:22px;

font-weight:700;

box-shadow:0 4px 20px rgba(109, 40, 217, 0.2);

}

.search-box{

padding:15px;

background:#fff;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}

.search-box input{

width:100%;

padding:13px;

border:1px solid #ddd;

border-radius:12px;

outline:none;

font-size:15px;

}

.chat-list{

padding:10px;

}

</style>

</head>

<body>

<div class="category-header">
    <button class="back-btn-small" onclick="history.back()">←</button>
    <div class="category-title-area">
        <h1 data-i18n="my_chats">Chats</h1>
    </div>
</div>

<div class="search-box">
<input
id="searchInput"
type="text"
data-i18n="search_placeholder"
placeholder="Search chats...">
</div>

<div
id="chatList"
class="chat-list">
<!-- ===================================================== -->
<!--                 SELLBY CHATS.HTML                    -->
<!--                    HTML PART 2                       -->
<!-- ===================================================== -->

<div
id="loadingMessage"
style="
text-align:center;
padding:40px;
color:#666;
" data-i18n="loading">
Loading Chats...
</div>

<div
id="emptyState"
style="
display:none;
text-align:center;
padding:50px 20px;
color:#666;
">

<div
style="
font-size:60px;
margin-bottom:15px;
">
💬
</div>

<h2 data-i18n="no_ads_yet">
No Chats Yet
</h2>

<p data-i18n="empty_desc">
Your conversations will appear here.
</p>

</div>

</div>

<style>

.chat-item{

display:flex;

align-items:center;

gap:15px;

background:#fff;

padding:15px;

border-radius:16px;

margin-bottom:12px;

box-shadow:0 2px 10px rgba(0,0,0,.08);

cursor:pointer;

transition:.2s;

position:relative;

}

.chat-item.unread{

background:#f5f3ff;

border-left:4px solid #7c3aed;

}

.unread-dot{

width:12px;

height:12px;

background:#db2777;

border-radius:50%;

margin-left:auto;

flex-shrink:0;

}

.chat-item:hover{

transform:translateY(-2px);

}

.avatar{

width:55px;

height:55px;

border-radius:50%;

background:linear-gradient(135deg, #7c3aed, #db2777);

color:#fff;

display:flex;

align-items:center;

justify-content:center;

font-size:22px;

font-weight:600;

}

.chat-info{

flex:1;

}

.chat-name{

font-size:17px;

font-weight:600;

margin-bottom:4px;

}

.last-message{

color:#666;

font-size:14px;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}

.chat-time{

font-size:12px;

color:#999;

}

</style>

<nav class="bottom-nav">
    <a href="index.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M9 21v-6h6v6" fill="currentColor" stroke="none"></path></svg>

    </a>
    <a href="saved.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 8.7 A5.5 5.5 0 0 0 12 5.2 A5.5 5.5 0 0 0 3.2 8.7 C2.5 12.4 5.4 15 12 20 c6.6-5 9.5-7.6 8.8-11.3z"></path></svg>
        <small>Saved</small>
    </a>
    <a href="chats.html" class="active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5 a7.5 7.5 0 0 1-7.5 7.5 7.3 7.3 0 0 1-3.3-.8 L4 20l1.8-4.8 A7.3 7.3 0 0 1 5 11.5 A7.5 7.5 0 0 1 12.5 4 A7.5 7.5 0 0 1 20 11.5z"></path><circle cx="9" cy="12" r="0.8" fill="currentColor" stroke="none"></circle><circle cx="12.5" cy="12" r="0.8" fill="currentColor" stroke="none"></circle><circle cx="16" cy="12" r="0.8" fill="currentColor" stroke="none"></circle></svg>
        <small>Chat</small>
    </a>
    <a href="profile.html">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"></circle><path d="M4 21 a8 8 0 0 1 16 0"></path></svg>
        <small>Profile</small>
    </a>
</nav>

<script
type="module"
src="js/firebase-config.js">

</script>

<script
type="module"
src="js/chats.js">

</script>

</body>

</html>
