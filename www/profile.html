<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELLBY | Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/auth-guard.js"></script>
</head>
<body>
    <header class="category-header">
        <button class="back-btn-small" onclick="history.back()">←</button>
        <div class="category-title-area">
            <h1 data-i18n="profile">Profile</h1>
        </div>
    </header>
    <main class="profile-page">
        <section class="profile-card">
            <div class="profile-avatar" style="cursor: pointer; position: relative;" onclick="location.href='settings.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 45px; height: 45px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <div style="position: absolute; bottom: 0; right: 0; background: #ffffff; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); border: 1px solid #f1f5f9;">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                </div>
            </div>
            <h1 id="userName">Loading...</h1>
            <p id="userEmail">Loading Email...</p>
        </section>

        <section class="profile-menu">
            <a href="my-ads.html" class="profile-item">
                <div class="profile-item-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                </div>
                <span class="profile-item-text" data-i18n="my_ads">My Ads</span>
                <span class="profile-item-arrow">→</span>
            </a>
            <a href="saved.html" class="profile-item">
                <div class="profile-item-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                </div>
                <span class="profile-item-text" data-i18n="saved">Saved Ads</span>
                <span class="profile-item-arrow">→</span>
            </a>
            <a href="settings.html" class="profile-item">
                <div class="profile-item-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </div>
                <span class="profile-item-text" data-i18n="settings">Settings</span>
                <span class="profile-item-arrow">→</span>
            </a>
            <button id="logoutBtn" class="publish-btn" type="button" data-i18n="logout">Logout</button>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="index.html">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M9 21v-6h6v6" fill="currentColor" stroke="none"></path></svg>
            <small data-i18n="home">Home</small>
        </a>
        <a href="saved.html">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 8.7 A5.5 5.5 0 0 0 12 5.2 A5.5 5.5 0 0 0 3.2 8.7 C2.5 12.4 5.4 15 12 20 c6.6-5 9.5-7.6 8.8-11.3z"></path></svg>
            <small data-i18n="saved">Saved</small>
        </a>
        <a href="chats.html">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5 a7.5 7.5 0 0 1-7.5 7.5 7.3 7.3 0 0 1-3.3-.8 L4 20l1.8-4.8 A7.3 7.3 0 0 1 5 11.5 A7.5 7.5 0 0 1 12.5 4 A7.5 7.5 0 0 1 20 11.5z"></path><circle cx="9" cy="12" r="0.8" fill="currentColor" stroke="none"></circle><circle cx="12.5" cy="12" r="0.8" fill="currentColor" stroke="none"></circle><circle cx="16" cy="12" r="0.8" fill="currentColor" stroke="none"></circle></svg>
            <small data-i18n="chat">Chat</small>
        </a>
        <a href="profile.html" class="active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"></circle><path d="M4 21 a8 8 0 0 1 16 0"></path></svg>
            <small data-i18n="profile">Profile</small>
        </a>
    </nav>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/profile.js"></script>
</body>
</html>
