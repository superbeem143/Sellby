<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SELLBY - Property Details</title>

<link rel="stylesheet" href="css/style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

.container{
max-width:900px;
margin:auto;
background:#fff;
min-height:100vh;
}

#loading{
padding:40px;
text-align:center;
font-size:20px;
font-weight:bold;
}

#error{
display:none;
padding:40px;
text-align:center;
color:red;
font-size:20px;
}

#content{
display:none;
}

#imageSlider{
width:100%;
overflow:hidden;
}

.property-image{
width:100%;
height:300px;
object-fit:cover;
display:block;
}

.details{
padding:20px;
}

.price{
font-size:32px;
font-weight:800;
color:#6d28d9;
margin-top:10px;
}

.title{
font-size:26px;
font-weight:bold;
margin-top:10px;
}

.info{
margin-top:12px;
font-size:18px;
color:#555;
}

.description{
margin-top:20px;
line-height:1.7;
font-size:17px;
}

</style>

<script type="module" src="js/auth-guard.js"></script>

</head>

<body>
    <header class="category-header">
        <button class="back-btn-small" onclick="history.back()">←</button>
        <div class="category-title-area">
            <h1 data-i18n="ad_details_title">Property Details</h1>
        </div>
    </header>

<div class="container">

<div id="loading">

Loading Property...

</div>

<div id="error"></div>

<div id="content">
<div id="imageSlider"></div>

<div class="details">

    <div
        class="price"
        id="propertyPrice">
    </div>

    <div
        class="title"
        id="propertyTitle">
    </div>

    <div
        class="info">

        📍
        <span id="propertyLocation"></span>

    </div>

    <div
        class="info">

        🏠
        <span id="propertyType"></span>

    </div>

    <div
        class="description"
        id="propertyDescription">

    </div>
<div style="margin-top:25px;">

<button
id="chatBtn"
style="
width:100%;
padding:16px;
background:linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
color:#fff;
border:none;
border-radius:16px;
font-size:18px;
font-weight:600;
cursor:pointer;
box-shadow:0 10px 20px rgba(124, 58, 237, 0.25);
">

💬 Chat with Seller

</button>

</div>
</div>
</div>

</div>

<script type="module" src="./js/property-details.js"></script>
</body>
