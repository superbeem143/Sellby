<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELLBY | Voice Posting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/auth-guard.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f8fafc; color: #0f172a; padding-bottom: 40px; }
        .header { background: var(--sellby-gradient-header); color: #fff; padding: 18px 20px; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 4px 20px rgba(109, 40, 217, 0.2); }
        .back-btn { position: absolute; left: 18px; width: 40px; height: 40px; border: none; border-radius: 12px; background: rgba(255,255,255,0.18); color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .page-title h1 { font-size: 22px; font-weight: 700; text-align: center; }
        .page-wrap { max-width: 600px; margin: 20px auto; padding: 0 16px; }
        .card { background: #ffffff; border-radius: 24px; padding: 24px; box-shadow: 0 10px 30px rgba(124, 58, 237, 0.08); border: 1px solid #f1f5f9; margin-bottom: 20px; }
        .section-label { font-size: 16px; font-weight: 700; color: #1e293b; margin-bottom: 12px; display: block; }

        /* Box 1: Photo Upload */
        .upload-area { border: 2px dashed #cbd5e1; border-radius: 18px; padding: 20px; text-align: center; background: #f8fafc; cursor: pointer; transition: all 0.2s; }
        .upload-area:hover { border-color: #7c3aed; background: #f5f3ff; }
        .image-preview { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px; margin-top: 15px; }
        .preview-thumb { position: relative; height: 80px; border-radius: 10px; overflow: hidden; background: #eee; }
        .preview-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .remove-img { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.5); color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; }

        /* Box 2: Ad Details */
        .details-container { position: relative; }
        textarea { width: 100%; border: 2px solid #e2e8f0; border-radius: 16px; padding: 15px; padding-right: 50px; font-size: 15px; background: #f8fafc; min-height: 200px; outline: none; transition: all 0.2s; resize: none; }
        textarea:focus { border-color: #7c3aed; background: #fff; }
        .mic-btn-inline { position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--sellby-gradient); color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(124, 58, 237, 0.3); transition: transform 0.2s; }
        .mic-btn-inline.recording { background: #ef4444; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .publish-btn { width: 100%; background: var(--sellby-gradient); color: #fff; border: none; border-radius: 16px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; box-shadow: 0 10px 24px rgba(124, 58, 237, 0.25); transition: all 0.2s; }
        .publish-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-msg { margin-top: 12px; text-align: center; font-size: 13px; font-weight: 500; color: #64748b; }
    </style>
</head>
<body>

    <header class="header">
        <button class="back-btn" onclick="history.back()">←</button>
        <div class="page-title">
            <h1>Voice Posting</h1>
        </div>
    </header>

    <main class="page-wrap">
        <!-- Box 1: Photos -->
        <section class="card">
            <label class="section-label">Add Photos</label>
            <div class="upload-area" onclick="document.getElementById('photos').click()">
                <div style="font-size: 30px; margin-bottom: 5px;">📷</div>
                <div style="font-weight: 600; color: #7c3aed;">Choose File</div>
                <div style="font-size: 12px; color: #94a3b8;">Add photos (optional)</div>
                <input type="file" id="photos" multiple accept="image/*" style="display: none;">
            </div>
            <div class="image-preview" id="imagePreview"></div>
            <div id="previewCount" style="font-size: 12px; color: #64748b; margin-top: 8px;">0 / 10 images selected</div>
        </section>

        <!-- Box 2: Ad Details -->
        <section class="card">
            <label class="section-label">Ad Details</label>
            <div class="details-container">
                <textarea id="adDescription" placeholder="Tap the microphone and speak, or type your ad details..."></textarea>
                <button id="micBtn" class="mic-btn-inline" title="Speak to write description">🎤</button>
            </div>

            <button id="publishBtn" class="publish-btn">Publish</button>
            <div id="statusMessage" class="status-msg">Ready to publish</div>
        </section>
    </main>

    <!-- Scripts -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/voice-post.js"></script>
</body>
</html>
