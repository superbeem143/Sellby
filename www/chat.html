<!--                 SELLBY CHAT.HTML                      -->
<!-- ===================================================== -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SELLBY Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/auth-guard.js"></script>
</head>

<body class="chat-page-body">

<header class="header">
    <button class="back-btn-small" onclick="history.back()">←</button>
    <div class="header-center">
        <h1 id="sellerName">Seller</h1>
        <p id="sellerStatus" data-i18n="online">Online</p>
    </div>
</header>

<!-- ================= AD CONTEXT BANNER ================= -->
<div id="adContextBanner" class="ad-context-banner">
    <div class="ad-context-thumb">
        <img id="adContextImg" src="" alt="Ad Thumbnail">
    </div>
    <div class="ad-context-info">
        <h4 id="adContextTitle" data-i18n="loading">Loading Ad...</h4>
        <div class="ad-context-meta">
            <span id="adContextPrice"></span>
            <span id="adContextLocation"></span>
        </div>
    </div>
    <div class="ad-context-action">
        <span data-i18n="view_all">View</span> →
    </div>
</div>

<!-- ================= CHAT AREA ================= -->
<div id="chatMessages" class="chat-area"></div>

<!-- ================= COMPOSER AREA ================= -->
<div class="composer-container">
    <div id="voiceRecordingBar" class="voice-recording-bar" style="display:none;">
        <div class="recording-indicator">
            <span data-i18n="recording">Recording</span>
            <span id="recTimer" class="rec-timer">00:00</span>
        </div>
        <div class="recording-actions">
            <button id="cancelVoiceBtn" type="button" class="voice-action-btn cancel" data-i18n="cancel">Cancel</button>
            <button id="sendVoiceNoteBtn" type="button" class="voice-action-btn send" data-i18n="send_voice">Send Voice</button>
        </div>
    </div>

    <div class="input-area">
        <button id="voiceMsgBtn" class="voice-msg-btn" type="button" title="Record Voice">🎤</button>
        <input id="messageInput" type="text" data-i18n="type_message" placeholder="Type your message...">
        <button id="sendBtn" class="send-btn"></button>
    </div>
</div>

<script type="module" src="./js/firebase-config.js"></script>
<script type="module" src="./js/chat.js"></script>
<script type="module" src="./js/messages.js"></script>

</body>
</html>
