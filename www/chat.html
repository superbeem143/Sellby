<!-- ===================================================== -->
<!--                 SELLBY CHAT.HTML                      -->
<!--                     HTML PART 1                       -->
<!-- ===================================================== -->

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SELLBY Chat</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<script type="module" src="js/auth-guard.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:#f8fafc;

display:flex;

flex-direction:column;

height:100vh;

}

.header{

height:65px;

background:linear-gradient(135deg, #6d28d9, #db2777);

color:#fff;

display:flex;

align-items:center;

padding:0 16px;

gap:15px;

box-shadow:0 4px 20px rgba(109, 40, 217, 0.2);

}

.back{

font-size:24px;

cursor:pointer;

}

.user{

display:flex;

flex-direction:column;

}

.user h2{

font-size:18px;

font-weight:600;

}

.user p{

font-size:12px;

opacity:.9;

}

.chat-area{

flex:1;

overflow-y:auto;

padding:15px;

background:#f8fafc;

display:flex;

flex-direction:column;

gap:12px;

}

</style>

</head>

<body>

<div class="header">

<div
class="back"
onclick="history.back()">

←

</div>

<div class="user">

<h2 id="sellerName">

Seller

</h2>

<p id="sellerStatus">

Online

</p>

</div>

</div>

<!-- ================= AD CONTEXT BANNER ================= -->

<div id="adContextBanner" style="display:none;background:#fff;padding:10px 15px;border-bottom:1px solid #ddd;align-items:center;gap:12px;cursor:pointer;">

    <div style="width:50px;height:50px;border-radius:8px;overflow:hidden;background:#eee;flex-shrink:0;">
        <img id="adContextImg" src="" alt="Ad Thumbnail" style="width:100%;height:100%;object-fit:cover;">
    </div>

    <div style="flex:1;">
        <h4 id="adContextTitle" style="font-size:14px;color:#6d28d9;margin-bottom:2px;font-weight:700;">Loading Ad...</h4>
        <p id="adContextPrice" style="font-size:13px;color:#0f172a;font-weight:700;"></p>
        <p id="adContextLocation" style="font-size:11px;color:#64748b;"></p>
    </div>

    <div style="font-size:12px;color:#db2777;font-weight:600;">View Ad →</div>

</div>

<div
id="chatMessages"
class="chat-area">

</div>
<!-- ===================================================== -->
<!--                 SELLBY CHAT.HTML                      -->
<!--                     HTML PART 2                       -->
<!-- ===================================================== -->

<style>

.message{

max-width:80%;

padding:12px 15px;

border-radius:16px;

font-size:15px;

line-height:1.5;

word-wrap:break-word;

}

.sent{

background:linear-gradient(135deg, #7c3aed, #db2777);

color:#fff;

align-self:flex-end;

border-bottom-right-radius:4px;

box-shadow:0 4px 15px rgba(124, 58, 237, 0.2);

}

.received{

background:#fff;

color:#0f172a;

align-self:flex-start;

border-bottom-left-radius:4px;

box-shadow:0 4px 15px rgba(0,0,0,.06);

border:1px solid #f1f5f9;

}

.input-area{

display:flex;

gap:10px;

padding:12px 16px;

background:#fff;

border-top:1px solid #e2e8f0;

}

.input-area input{

flex:1;

padding:14px 18px;

border:2px solid #e2e8f0;

border-radius:30px;

outline:none;

font-size:15px;

transition:border-color 0.2s;

}

.input-area input:focus{

border-color:#7c3aed;

}

.input-area button{

background:linear-gradient(135deg, #7c3aed 0%, #db2777 100%);

color:#fff;

border:none;

padding:0 24px;

border-radius:30px;

.voice-msg-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid #e2e8f0;
    background: #f5f3ff;
    color: #7c3aed;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s ease;
}

.voice-msg-btn:hover {
    background: #ede9fe;
    border-color: #7c3aed;
    transform: scale(1.05);
}

.voice-msg-btn.recording {
    background: #fef2f2;
    border-color: #ef4444;
    color: #ef4444;
    animation: pulse 1.2s infinite;
}

.voice-recording-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: #fef2f2;
    border-top: 1px solid #fecaca;
}

.recording-indicator {
    font-weight: 700;
    color: #dc2626;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.voice-action-btn {
    border: none;
    padding: 8px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}

.voice-action-btn.cancel {
    background: #f1f5f9;
    color: #64748b;
    margin-right: 6px;
}

.voice-action-btn.send {
    background: linear-gradient(135deg, #7c3aed, #db2777);
    color: #ffffff;
}

.audio-bubble-player {
    margin-top: 6px;
    max-width: 240px;
}

.audio-bubble-player audio {
    width: 100%;
    height: 38px;
    border-radius: 18px;
}

</style>

<div id="voiceRecordingBar" class="voice-recording-bar" style="display:none;">
    <span class="recording-indicator">🔴 Recording: <span id="recTimer">00:00</span></span>
    <div class="recording-actions">
        <button id="cancelVoiceBtn" type="button" class="voice-action-btn cancel">Cancel</button>
        <button id="sendVoiceNoteBtn" type="button" class="voice-action-btn send">Send Voice 🎵</button>
    </div>
</div>

<div class="input-area">

<button id="voiceMsgBtn" class="voice-msg-btn" type="button" title="Record Voice Message">🎤</button>

<input

id="messageInput"

type="text"

placeholder="Type your message...">

<button

id="sendBtn">

Send

</button>

</div>
<!-- ===================================================== -->
<!--                 SELLBY CHAT.HTML                      -->
<!--                     HTML PART 3                       -->
<!-- ===================================================== -->

<script type="module" src="./js/firebase-config.js"></script>

<script type="module" src="./js/chat.js"></script>

<script type="module" src="./js/messages.js"></script>

</body>

</html>
