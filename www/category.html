<!-- ===================================================== -->
<!--               SELLBY CATEGORY.HTML                    -->
<!--                     HTML PART 1                       -->
<!-- ===================================================== -->

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SELLBY | Category</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="css/style.css">

<script type="module" src="js/auth-guard.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f7fb;
}

header{
background:linear-gradient(135deg, #6d28d9, #db2777);
color:#fff;
padding:18px;
display:flex;
align-items:center;
gap:15px;
box-shadow:0 4px 20px rgba(109, 40, 217, 0.2);
}

.back-btn{
background:none;
border:none;
color:#fff;
font-size:24px;
cursor:pointer;
}

.header-title{
font-size:22px;
font-weight:600;
}

.search-box{
padding:15px;
background:#fff;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.search-box input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
outline:none;
}

.category-info{
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.category-name{
font-size:22px;
font-weight:700;
}

.ads-count{
color:#666;
font-size:14px;
}

</style>

</head>

<body>

<header>

<button
class="back-btn"
onclick="history.back()">

←

</button>

<div class="header-title">

SELLBY

</div>

</header>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search properties...">

</div>

<div class="category-info">

<div
class="category-name">

Properties

</div>

<div
class="ads-count"
id="adsCount">

Loading...

</div>

</div>
<!-- ===================================================== -->
<!--               SELLBY CATEGORY.HTML                    -->
<!--                     HTML PART 2                       -->
<!-- ===================================================== -->

<main class="page-wrap">

    <section
        class="ads-section">

        <div
            id="loadingMessage"
            class="loading-message">

            Loading Properties...

        </div>

        <div
            id="emptyState"
            class="empty-state"
            style="display:none;">

            <div class="empty-icon">

                🏡

            </div>

            <h2>

                No Properties Found

            </h2>

            <p>

                No property ads are available yet.

            </p>

        </div>

        <div
            id="adsContainer"
            class="ads-grid">

        </div>

    </section>

</main>

<style>

.page-wrap{

padding:15px;

}

.ads-grid{

display:grid;

grid-template-columns:1fr;

gap:16px;

}

.ad-card{

background:#fff;

border-radius:18px;

overflow:hidden;

box-shadow:0 4px 15px rgba(0,0,0,.08);

cursor:pointer;

transition:.2s;

}

.ad-card:hover{

transform:translateY(-2px);

}

.ad-image{

width:100%;

height:220px;

background:#eee;

overflow:hidden;

}

.ad-image img{

width:100%;

height:100%;

object-fit:cover;

}

.loading-message,

.empty-state{

text-align:center;

padding:40px 20px;

color:#666;

}

.empty-icon{

font-size:60px;

margin-bottom:15px;

}

</style>
<!-- ===================================================== -->
<!--               SELLBY CATEGORY.HTML                    -->
<!--                     HTML PART 3                       -->
<!-- ===================================================== -->

<!-- Firebase -->

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/category.js"></script>
</body>

</html>
