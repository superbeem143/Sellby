<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SELLBY | Admin Authorization</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
body {
    font-family: "Poppins", sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e1b4b);
    color: #f8fafc;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    margin: 0;
}
.admin-login-card {
    width: 100%;
    max-width: 440px;
    background: rgba(30, 41, 59, 0.95);
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 24px;
    padding: 32px 24px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    backdrop-filter: blur(12px);
    position: relative;
    overflow: hidden;
}
.admin-login-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #7c3aed, #db2777, #7c3aed);
}
.admin-header {
    text-align: center;
    margin-bottom: 28px;
}
.admin-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: rgba(124, 58, 237, 0.2);
    border: 1px solid rgba(168, 85, 247, 0.4);
    border-radius: 20px;
    color: #c084fc;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.admin-title {
    font-size: 24px;
    font-weight: 800;
    color: #ffffff;
    margin-bottom: 6px;
}
.admin-subtitle {
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.5;
}
.auth-box {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
}
.auth-user-info {
    display: flex;
    align-items: center;
    gap: 12px;
}
.auth-user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #7c3aed;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: #fff;
    font-size: 16px;
    flex-shrink: 0;
}
.auth-user-details {
    flex: 1;
    min-width: 0;
}
.auth-user-name {
    font-size: 14px;
    font-weight: 700;
    color: #f1f5f9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.auth-user-email {
    font-size: 12px;
    color: #cbd5e1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.input-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #cbd5e1;
    margin-bottom: 8px;
}
.password-wrapper {
    position: relative;
    margin-bottom: 20px;
}
.password-input {
    width: 100%;
    height: 52px;
    background: rgba(15, 23, 42, 0.8);
    border: 2px solid rgba(139, 92, 246, 0.3);
    border-radius: 14px;
    padding: 0 16px;
    font-size: 16px;
    color: #ffffff;
    outline: none;
    transition: all 0.2s ease;
    box-sizing: border-box;
}
.password-input:focus {
    border-color: #a855f7;
    box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.2);
}
.btn-primary {
    width: 100%;
    height: 52px;
    background: linear-gradient(135deg, #7c3aed, #a855f7 50%, #db2777);
    border: none;
    border-radius: 14px;
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(124, 58, 237, 0.35);
    transition: transform 0.15s ease, opacity 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.btn-primary:active {
    transform: scale(0.98);
}
.btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}
.btn-secondary {
    width: 100%;
    height: 48px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    color: #cbd5e1;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
    transition: background 0.2s ease;
}
.btn-secondary:hover {
    background: rgba(255, 255, 255, 0.1);
}
.status-msg {
    margin-top: 16px;
    padding: 12px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    display: none;
}
.status-msg.error {
    display: block;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
}
.status-msg.success {
    display: block;
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.3);
    color: #86efac;
}
.back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #94a3b8;
    font-size: 13px;
    text-decoration: none;
    font-weight: 500;
}
.back-link:hover {
    color: #c084fc;
}
</style>
</head>
<body>

<div class="admin-login-card">
    <div class="admin-header">
        <div class="admin-badge">
            🛡️ SELLBY Security Gate
        </div>
        <h1 class="admin-title">Admin Access</h1>
        <p class="admin-subtitle">Enter your Secret Admin Password to unlock the Admin Portal.</p>
    </div>

    <!-- Active User Box -->
    <div class="auth-box">
        <div class="auth-user-info">
            <div id="userAvatar" class="auth-user-avatar">A</div>
            <div class="auth-user-details">
                <div id="userName" class="auth-user-name">Authorized Admin</div>
                <div id="userEmail" class="auth-user-email">Checking Auth...</div>
            </div>
        </div>
    </div>

    <!-- Secret Password Form -->
    <form id="adminLoginForm">
        <!-- Bootstrap Password Input (First Time Step 1) -->
        <div id="bootstrapWrapper" class="password-wrapper" style="display:none;">
            <label for="bootstrapPassword" class="input-label">Temporary Bootstrap Password</label>
            <input type="password" id="bootstrapPassword" class="password-input" placeholder="Enter temporary code (e.g. 999999)" autocomplete="off">
        </div>

        <!-- Secret Password Input (Step 2 or Regular Login) -->
        <div id="secretPasswordWrapper" class="password-wrapper">
            <label id="passwordLabel" for="secretPassword" class="input-label">Secret Admin Password</label>
            <input type="password" id="secretPassword" class="password-input" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <!-- Confirm Secret Password Input (First Time Step 2) -->
        <div id="confirmPasswordWrapper" class="password-wrapper" style="display:none; margin-top:12px;">
            <label for="confirmSecretPassword" class="input-label">Confirm New Secret Password</label>
            <input type="password" id="confirmSecretPassword" class="password-input" placeholder="••••••••••••" autocomplete="new-password">
        </div>

        <button type="submit" id="verifyBtn" class="btn-primary" style="margin-top:20px;">
            <span id="btnText">Unlock Admin Portal</span> →
        </button>
    </form>

    <button id="gmailSignInBtn" class="btn-secondary" style="display:none;">
        🔐 Sign In with Authorized Admin Gmail
    </button>

    <div id="statusMessage" class="status-msg"></div>

    <a href="settings.html" class="back-link">← Return to Settings</a>
</div>

<script type="module">
import { auth, db, getDoc, doc } from "./js/firebase-config.js";
import { verifySecretPassword, setAdminSession, logAdminAction, signInWithAdminGmail, isAuthorizedAdmin, isAdminPasswordInitialized, initializeAdminPassword, verifyBootstrapPassword } from "./js/admin-auth.js";

const adminLoginForm = document.getElementById("adminLoginForm");
const bootstrapWrapper = document.getElementById("bootstrapWrapper");
const bootstrapPasswordInput = document.getElementById("bootstrapPassword");
const secretPasswordWrapper = document.getElementById("secretPasswordWrapper");
const secretPasswordInput = document.getElementById("secretPassword");
const confirmSecretPasswordInput = document.getElementById("confirmSecretPassword");
const confirmPasswordWrapper = document.getElementById("confirmPasswordWrapper");
const passwordLabel = document.getElementById("passwordLabel");
const verifyBtn = document.getElementById("verifyBtn");
const btnText = document.getElementById("btnText");
const statusMessage = document.getElementById("statusMessage");
const userName = document.getElementById("userName");
const userEmail = document.getElementById("userEmail");
const userAvatar = document.getElementById("userAvatar");
const gmailSignInBtn = document.getElementById("gmailSignInBtn");
const cardTitle = document.querySelector(".admin-title");
const cardSubtitle = document.querySelector(".admin-subtitle");

let isFirstTimeSetup = false;
let isBootstrapVerified = false;

function showStatus(msg, type = "error") {
    statusMessage.textContent = msg;
    statusMessage.className = `status-msg ${type}`;
}

async function checkAdminAuth() {
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            userEmail.textContent = "Not signed in";
            showStatus("Access Denied: Please log in with the Authorized Admin Email.", "error");
            verifyBtn.disabled = true;
            adminLoginForm.style.display = "none";
            gmailSignInBtn.style.display = "block";
            return;
        }

        if (!user.email) {
            userEmail.textContent = `Phone Account (${user.phoneNumber || "No Email"})`;
            showStatus("Access Denied: Mobile/Phone accounts do not have Admin access. Redirecting...", "error");
            verifyBtn.disabled = true;
            adminLoginForm.style.display = "none";
            gmailSignInBtn.style.display = "none";
            setTimeout(() => { window.location.replace("index.html"); }, 1500);
            return;
        }

        userEmail.textContent = user.email;
        userName.textContent = user.displayName || "Admin Account";
        userAvatar.textContent = (user.displayName || user.email || "A").charAt(0).toUpperCase();

        const isAdmin = await isAuthorizedAdmin(user);

        if (!isAdmin) {
            showStatus(`Access Denied: Account (${user.email}) is not authorized for Admin access. Redirecting...`, "error");
            verifyBtn.disabled = true;
            adminLoginForm.style.display = "none";
            gmailSignInBtn.style.display = "none";
            setTimeout(() => { window.location.replace("index.html"); }, 1500);
        } else {
            verifyBtn.disabled = false;
            adminLoginForm.style.display = "block";
            gmailSignInBtn.style.display = "none";

            const initialized = await isAdminPasswordInitialized();
            isFirstTimeSetup = !initialized;

            if (isFirstTimeSetup) {
                if (cardTitle) cardTitle.textContent = "First-Time Admin Setup";
                if (cardSubtitle) cardSubtitle.textContent = "Enter the Temporary Bootstrap Password to unlock initial admin password creation.";
                
                // Step 1: Show Bootstrap Input only
                if (bootstrapWrapper) bootstrapWrapper.style.display = "block";
                if (bootstrapPasswordInput) bootstrapPasswordInput.required = true;
                if (secretPasswordWrapper) secretPasswordWrapper.style.display = "none";
                if (secretPasswordInput) secretPasswordInput.required = false;
                if (confirmPasswordWrapper) confirmPasswordWrapper.style.display = "none";
                if (confirmSecretPasswordInput) confirmSecretPasswordInput.required = false;
                if (btnText) btnText.textContent = "Verify Bootstrap Code";
                showStatus("First-Time Setup: Enter temporary bootstrap code (999999).", "success");
            } else {
                if (cardTitle) cardTitle.textContent = "Admin Access";
                if (cardSubtitle) cardSubtitle.textContent = "Enter your Secret Admin Password to unlock the Admin Portal.";
                if (bootstrapWrapper) bootstrapWrapper.style.display = "none";
                if (bootstrapPasswordInput) bootstrapPasswordInput.required = false;
                if (secretPasswordWrapper) secretPasswordWrapper.style.display = "block";
                if (secretPasswordInput) secretPasswordInput.required = true;
                if (confirmPasswordWrapper) confirmPasswordWrapper.style.display = "none";
                if (confirmSecretPasswordInput) confirmSecretPasswordInput.required = false;
                if (btnText) btnText.textContent = "Unlock Admin Portal";
            }
        }
    });
}

gmailSignInBtn?.addEventListener("click", async () => {
    try {
        const user = await signInWithAdminGmail();
        showStatus(`Signed in as ${user.email}`, "success");
        checkAdminAuth();
    } catch (e) {
        showStatus(e.message || "Google Sign-In failed", "error");
    }
});

adminLoginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    verifyBtn.disabled = true;
    verifyBtn.innerHTML = `<span>Processing...</span>`;
    statusMessage.style.display = "none";

    try {
        if (isFirstTimeSetup) {
            // STEP 1: Verify Bootstrap Password (999999)
            if (!isBootstrapVerified) {
                const enteredBootstrap = bootstrapPasswordInput ? bootstrapPasswordInput.value.trim() : "";
                if (!verifyBootstrapPassword(enteredBootstrap)) {
                    showStatus("Invalid Temporary Bootstrap Password. Access Denied.", "error");
                    verifyBtn.disabled = false;
                    verifyBtn.innerHTML = `<span id="btnText">Verify Bootstrap Code</span> →`;
                    return;
                }

                // Bootstrap verified successfully -> Move to Step 2
                isBootstrapVerified = true;
                showStatus("Bootstrap Code Verified! Set your NEW permanent Secret Password.", "success");
                if (cardTitle) cardTitle.textContent = "Create New Secret Password";
                if (cardSubtitle) cardSubtitle.textContent = "Please create and confirm your permanent Secret Admin Password.";
                
                if (bootstrapWrapper) bootstrapWrapper.style.display = "none";
                if (bootstrapPasswordInput) bootstrapPasswordInput.required = false;
                
                if (secretPasswordWrapper) secretPasswordWrapper.style.display = "block";
                if (passwordLabel) passwordLabel.textContent = "New Secret Admin Password";
                if (secretPasswordInput) {
                    secretPasswordInput.required = true;
                    secretPasswordInput.value = "";
                    secretPasswordInput.focus();
                }

                if (confirmPasswordWrapper) confirmPasswordWrapper.style.display = "block";
                if (confirmSecretPasswordInput) {
                    confirmSecretPasswordInput.required = true;
                    confirmSecretPasswordInput.value = "";
                }

                if (btnText) btnText.textContent = "Save Password & Unlock Portal";
                verifyBtn.disabled = false;
                return;
            }

            // STEP 2: Save New Permanent Secret Password
            const newPassword = secretPasswordInput.value.trim();
            const confirmPass = confirmSecretPasswordInput.value.trim();

            if (newPassword.length < 6) {
                showStatus("Secret Password must be at least 6 characters.", "error");
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = `<span id="btnText">Save Password & Unlock Portal</span> →`;
                return;
            }

            if (newPassword !== confirmPass) {
                showStatus("New Password and Confirmation do not match.", "error");
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = `<span id="btnText">Save Password & Unlock Portal</span> →`;
                return;
            }

            // Save salted SHA-256 password hash in Firestore and disable 999999 permanently
            await initializeAdminPassword(newPassword);
            await logAdminAction("ADMIN_PASSWORD_INITIALIZED", "AUTH", auth.currentUser?.email || "Admin", { method: "First-Time Bootstrap Setup" });

            showStatus("Secret Admin Password created successfully! Unlocking Admin Portal...", "success");
            setAdminSession(auth.currentUser?.email || "Admin");
            setTimeout(() => { window.location.replace("admin-portal.html"); }, 600);

        } else {
            // REGULAR LOGIN: Verify Permanent Secret Password
            const password = secretPasswordInput.value.trim();
            const isValid = await verifySecretPassword(password);
            if (isValid) {
                showStatus("Access Granted! Opening Admin Portal...", "success");
                const currentUser = auth.currentUser;
                const email = currentUser ? (currentUser.email || currentUser.phoneNumber) : "Admin";
                setAdminSession(email);
                await logAdminAction("ADMIN_LOGIN", "AUTH", email, { method: "Secret Password Verified" });
                
                setTimeout(() => {
                    window.location.replace("admin-portal.html");
                }, 600);
            } else {
                showStatus("Invalid Secret Admin Password. Access Denied.", "error");
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = `<span>Unlock Admin Portal</span> →`;
            }
        }
    } catch (err) {
        showStatus("Operation failed: " + err.message, "error");
        verifyBtn.disabled = false;
        verifyBtn.innerHTML = `<span>Submit</span> →`;
    }
});

document.addEventListener("DOMContentLoaded", checkAdminAuth);
</script>

</body>
</html>
