<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SELLBY | Sell Easy. Buy Easy.</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <button class="menu-btn">
        ☰
    </button>

    <div class="header-center">

        <h1 class="logo">
            <span class="sell">SELL</span><span class="by">BY</span>
        </h1>

        <p class="tagline">
            Sell Easy. Buy Easy.
        </p>

    </div>

    <button class="notify-btn">
        🔔
    </button>

</header>

<!-- ================= SEARCH ================= -->

<section class="search-section">

    <div class="search-box">

        <input
            type="text"
            placeholder="Search anything...">

        <button class="voice-btn">🎤</button>

        <button class="camera-btn">📷</button>

    </div>

</section>

<!-- ===================================================== -->
<!--

<!-- ===================================================== -->

<!-- ================= HERO ================= -->

<section class="hero">

    <h2>
        India's Premium Marketplace
    </h2>

    <p>
        Buy and Sell anything with ease.
    </p>

</section>

<!-- ================= CATEGORIES ================= -->

<section class="categories">

    <h2 class="section-title">
        Browse Categories
    </h2>

    <div class="category-grid">

        <!-- Mobiles -->

        <a href="category.html?type=mobiles" class="category-card">

            <div class="category-icon">📱</div>

            <h3>Mobiles</h3>

        </a>

        <!-- Cars & Bikes -->

        <a href="category.html?type=vehicles" class="category-card">

            <div class="category-icon">🚗🏍️</div>

            <h3>Cars & Bikes</h3>

        </a>

        <!-- Properties -->

        <a href="category.html?type=properties" class="category-card">

            <div class="category-icon">🏡</div>

            <h3>Properties</h3>

        </a>

        <!-- Electronics -->

        <a href="category.html?type=electronics" class="category-card">

            <div class="category-icon">💻</div>

            <h3>Electronics</h3>

        </a>

        <!-- Furniture -->

        <a href="category.html?type=furniture" class="category-card">

            <div class="category-icon">🪑</div>

            <h3>Furniture</h3>

        </a>

        <!-- Others -->

        <a href="category.html?type=others" class="category-card">

            <div class="category-icon">📦</div>

            <h3>Others</h3>

        </a>

    </div>

</section>

<!-- ================= LATEST ADS ================= -->

<section class="latest-ads">

    <h2 class="section-title">
        Latest Ads
    </h2>

    <div id="latestAds">

        <!-- Ads will load here -->

    </div>

</section>
