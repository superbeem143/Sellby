<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SELLBY | Sell Easy. Buy Easy.</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"

<body>

<!-- ================= SVG DEFINITIONS ================= -->

<svg style="width:0;height:0;position:absolute;" aria-hidden="true">
    <defs>

        <linearGradient id="handshake-grad"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">

            <stop offset="0%" stop-color="#7c3aed"/>
            <stop offset="100%" stop-color="#db2777"/>

        </linearGradient>

        <linearGradient id="violet-pink-grad"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">

            <stop offset="0%" stop-color="#7c3aed"/>
            <stop offset="100%" stop-color="#db2777"/>

        </linearGradient>

    </defs>
</svg>


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="header-center">

        <h1 class="logo">
            <span class="sell">SELL</span><span class="by">BY</span>
        </h1>

        <img src="images/sellby-handshake.png"
             alt="SELLBY Handshake Symbol"
             class="brand-handshake-img">

        <p class="tagline">
            Sell Easy. Buy Easy.
        </p>

    </div>


    <div class="header-actions">

        <!-- Notification -->

        <button class="notify-btn"
                id="notifyBtn"
                title="Notifications"
                aria-label="Notifications">

            <svg class="header-icon"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 aria-hidden="true">

                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>

                <path d="M10 21h4"></path>

            </svg>

        </button>


        <!-- Menu -->

        <button class="menu-btn"
                id="menuBtn"
                title="Menu"
                aria-label="Menu">

            <svg class="header-icon"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 aria-hidden="true">

                <circle cx="5" cy="12" r="1.5"></circle>
                <circle cx="12" cy="12" r="1.5"></circle>
                <circle cx="19" cy="12" r="1.5"></circle>

            </svg>

        </button>

    </div>

</header>

<!-- ================= SEARCH ================= -->

<section class="search-section">

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search anything...">


        <!-- Voice Search -->

        <button class="voice-btn"
                title="Voice Search"
                aria-label="Voice Search">

            <svg class="action-icon-svg"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <rect x="9"
                      y="2"
                      width="6"
                      height="12"
                      rx="3"></rect>

                <path d="M5 10a7 7 0 0 0 14 0"></path>

                <line x1="12"
                      y1="17"
                      x2="12"
                      y2="22"></line>

                <line x1="8"
                      y1="22"
                      x2="16"
                      y2="22"></line>

            </svg>

        </button>


        <!-- Visual Search -->

        <button class="camera-btn"
                title="Visual Search"
                aria-label="Visual Search">

            <svg class="action-icon-svg"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="M4 7h4l2-2h4l2 2h4
                         a2 2 0 0 1 2 2v9
                         a2 2 0 0 1-2 2H4
                         a2 2 0 0 1-2-2V9
                         a2 2 0 0 1 2-2z"></path>

                <circle cx="12"
                        cy="13"
                        r="3.5"></circle>

            </svg>

        </button>

    </div>

</section>
