<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SELLBY | Sell Easy. Buy Easy.</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

    <script type="module" src="js/auth-guard.js"></script>

</head>

<body>

<!-- ================= HEADER ================= -->

<svg style="width:0;height:0;position:absolute;" aria-hidden="true">
  <defs>
    <linearGradient id="handshake-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
  </defs>
</svg>

<header class="header">

    <div class="header-center">

        <h1 class="logo">
            <span class="sell">SELL</span><span class="by">BY</span>
        </h1>

        <img src="images/sellby-handshake.png" alt="SELLBY Handshake Symbol" class="brand-handshake-img">

        <p class="tagline">
            Sell Easy. Buy Easy.
        </p>

    </div>

    <div class="header-actions">

        <button class="notify-btn" id="notifyBtn" title="Notifications">
            🔔
        </button>

        <button class="menu-btn" id="menuBtn" title="Menu">
            ⋮
        </button>

    </div>

</header>

<!-- ================= DROPDOWN MENU ================= -->

<div id="sideMenu" class="dropdown-menu">

    <a href="profile.html" class="menu-item"><span class="menu-icon">👤</span> Profile</a>

    <a href="my-ads.html" class="menu-item"><span class="menu-icon">📢</span> My Ads</a>

    <a href="chats.html" class="menu-item"><span class="menu-icon">💬</span> My Chats</a>

    <a href="saved.html" class="menu-item"><span class="menu-icon">❤️</span> Saved</a>

    <a href="#" id="logoutBtn" class="menu-item logout"><span class="menu-icon">🚪</span> Logout</a>

</div>
<!-- ================= SEARCH ================= -->

<section class="search-section">

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search anything...">

        <button class="voice-btn" title="Voice Search">🎤</button>

        <button class="camera-btn" title="Visual Search">📷</button>

    </div>

</section>

<!-- ================= HERO ================= -->

<section class="hero">

    <h2>
        India's Premium Marketplace
    </h2>

    <p>
        Buy and Sell anything with ease.
    </p>

</section>

<!-- ================= CATEGORIES ================= -->

<svg style="width:0;height:0;position:absolute;" aria-hidden="true">
  <defs>
    <linearGradient id="violet-pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
</svg>

<section class="categories">

    <h2 class="section-title">
        Browse Categories
    </h2>

    <div class="category-grid">

        <!-- Mobiles -->
        <a href="category.html?type=mobiles" class="category-card">
            <div class="category-icon-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="2" width="14" height="20" rx="3" ry="3" fill="url(#violet-pink-grad)"></rect>
                    <line x1="12" y1="18" x2="12.01" y2="18" stroke="#fff" stroke-width="2.5"></line>
                    <line x1="10" y1="5" x2="14" y2="5" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"></line>
                </svg>
            </div>
            <h3>Mobiles</h3>
        </a>

        <!-- Cars & Bikes -->
        <a href="category.html?type=vehicles" class="category-card">
            <div class="category-icon-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H7c-.8 0-1.5.4-1.9 1.1L3.3 11C2.5 11.3 2 12.1 2 13v3c0 .6.4 1 1 1h2"></path>
                    <circle cx="7" cy="17" r="2.5" fill="#db2777" stroke="#fff" stroke-width="1.5"></circle>
                    <circle cx="17" cy="17" r="2.5" fill="#db2777" stroke="#fff" stroke-width="1.5"></circle>
                </svg>
            </div>
            <h3>Cars & Bikes</h3>
        </a>

        <!-- Properties -->
        <a href="category.html?type=properties" class="category-card">
            <div class="category-icon-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="url(#violet-pink-grad)"></path>
                    <polyline points="9 22 9 12 15 12 15 22" stroke="#ffffff" stroke-width="1.8"></polyline>
                </svg>
            </div>
            <h3>Properties</h3>
        </a>

        <!-- Electronics -->
        <a href="category.html?type=electronics" class="category-card">
            <div class="category-icon-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2" fill="url(#violet-pink-grad)"></rect>
                    <line x1="8" y1="21" x2="16" y2="21" stroke="#db2777" stroke-width="2.2"></line>
                    <line x1="12" y1="17" x2="12" y2="21" stroke="#db2777" stroke-width="2.2"></line>
                </svg>
            </div>
            <h3>Electronics</h3>
        </a>

        <!-- Furniture -->
        <a href="category.html?type=furniture" class="category-card">
            <div class="category-icon-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 19v2M18 19v2M4 11h16a2 2 0 0 1 2 2v4H2v-4a2 2 0 0 1 2-2z" fill="url(#violet-pink-grad)"></path>
                    <path d="M4 11V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5" stroke="#7c3aed" stroke-width="1.8"></path>
                </svg>
            </div>
            <h3>Furniture</h3>
        </a>

        <!-- Others -->
        <a href="category.html?type=others" class="category-card">
            <div class="category-icon-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" fill="url(#violet-pink-grad)"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96" stroke="#ffffff" stroke-width="1.8"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12" stroke="#ffffff" stroke-width="1.8"></line>
                </svg>
            </div>
            <h3>Others</h3>
        </a>

    </div>

</section>

<!-- ================= LATEST ADS ================= -->

<section class="latest-ads">

    <h2 class="section-title">
        Latest Ads
    </h2>

    <div id="latestAds">

        <!-- Ads will load here -->

    </div>

</section>
