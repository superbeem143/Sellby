<!-- ===================================================== -->

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SELLBY | Post Bike</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <button
            class="back-btn"
            onclick="history.back()">

            ←

        </button>

        <div class="page-title">

            <h1>

                Post Your Bike

            </h1>

            <p>

                Fill the details below

            </p>

        </div>

    </header>

    <!-- ================= POST FORM ================= -->

    <main class="page-wrap">

        <section class="card">

            <div class="form-grid">

                <div class="form-group upload-field">

                    <label for="photos">

                        Upload Photos

                    </label>

                    <input
                        id="photos"
                        name="photos"
                        type="file"
                        multiple
                        accept="image/*">

                    <span class="hint">

                        Upload up to 10 images.

                    </span>

                    <div
                        class="image-preview"
                        id="imagePreview">

                    </div>

                    <div
                        class="preview-count"
                        id="previewCount">

                        0 / 10 images selected

                    </div>

                </div>

                <div class="form-group">

                    <label for="brand">

                        Bike Brand

                    </label>

                    <input
                        id="brand"
                        name="brand"
                        type="text"
                        placeholder="Example: Hero"
                        required>

                </div>
<!-- ===================================================== -->
<!--              SELLBY POST-BIKE.HTML                   -->
<!--                   HTML PART 2                        -->
<!-- ===================================================== -->
<!--
    File Name : post-bike.html
    Project   : SELLBY
    Mission   : Sell Easy. Buy Easy.
    Part      : 2
    Contains  :
    ✔ Bike Model
    ✔ Year
    ✔ Fuel Type
    ✔ KM Driven
    ✔ Price
    ✔ Location
-->
<!-- ===================================================== -->

                <div class="form-group">

                    <label for="model">

                        Bike Model

                    </label>

                    <input
                        id="model"
                        name="model"
                        type="text"
                        placeholder="Example: Splendor Plus"
                        required>

                </div>

                <div class="form-group">

                    <label for="year">

                        Year

                    </label>

                    <input
                        id="year"
                        name="year"
                        type="number"
                        placeholder="Example: 2023"
                        required>

                </div>

                <div class="form-group">

                    <label for="fuel">

                        Fuel Type

                    </label>

                    <select
                        id="fuel"
                        name="fuel"
                        required>

                        <option value="">
                            Select Fuel Type
                        </option>

                        <option>Petrol</option>

                        <option>Electric</option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="kms">

                        KM Driven

                    </label>

                    <input
                        id="kms"
                        name="kms"
                        type="number"
                        placeholder="Example: 12000"
                        required>

                </div>

                <div class="form-group">

                    <label for="price">

                        Price

                    </label>

                    <input
                        id="price"
                        name="price"
                        type="number"
                        placeholder="Enter Price"
                        required>

                </div>

                <div class="form-group">

                    <label for="location">

                        Location

                    </label>

                    <input
                        id="location"
                        name="location"
                        type="text"
                        placeholder="City, Area or Landmark"
                        required>

                </div>
<!-- ===================================================== -->
<!--              SELLBY POST-BIKE.HTML                   -->
<!--                   HTML PART 3                        -->
<!-- ===================================================== -->
<!--
    File Name : post-bike.html
    Project   : SELLBY
    Mission   : Sell Easy. Buy Easy.
    Part      : 3
    Contains  :
    ✔ Description
    ✔ Contact Number
    ✔ WhatsApp Number
    ✔ Publish Button
    ✔ JavaScript Files
    ✔ Closing Body & HTML
-->
<!-- ===================================================== -->

                <div class="form-group">

                    <label for="description">

                        Description

                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe your bike..."
                        required></textarea>

                </div>

                <div class="form-group">

                    <label for="contactNumber">

                        Contact Number

                    </label>

                    <input
                        id="contactNumber"
                        name="contactNumber"
                        type="tel"
                        placeholder="Enter Contact Number"
                        required>

                </div>

                <div class="form-group">

                    <label for="whatsappNumber">

                        WhatsApp Number

                    </label>

                    <input
                        id="whatsappNumber"
                        name="whatsappNumber"
                        type="tel"
                        placeholder="Enter WhatsApp Number">

                </div>

            </div>

            <div class="submit-row">

                <div
                    class="status-message"
                    id="statusMessage">

                    Fill all required fields before publishing your bike.

                </div>

                <button
                    id="publishBtn"
                    class="publish-btn"
                    type="button">

                    Publish Bike

                </button>

            </div>

        </section>

    </main>

    <!-- ================= FIREBASE ================= -->

    <script
        type="module"
        src="js/firebase-config.js">
    </script>

    <!-- ================= POST BIKE ================= -->

    <script
        type="module"
        src="js/post-bike.js">
    </script>

</body>

</html>
