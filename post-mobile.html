<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SELLBY | Post Mobile</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

    <script type="module" src="js/auth-guard.js"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }
        body{
            background:#f8fafc;
            color:#0f172a;
            min-height:100vh;
        }
        .header{
            background:linear-gradient(135deg, #6d28d9, #db2777);
            color:#fff;
            padding:18px 20px;
            display:flex;
            align-items:center;
            justify-content:center;
            position:relative;
            box-shadow:0 4px 20px rgba(109, 40, 217, 0.2);
        }
        .back-btn{
            position:absolute;
            left:18px;
            width:40px;
            height:40px;
            border:none;
            border-radius:12px;
            background:rgba(255,255,255,0.18);
            color:#fff;
            font-size:20px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .page-title h1{
            font-size:22px;
            font-weight:700;
            text-align:center;
        }
        .page-title p{
            font-size:13px;
            color:#fce7f3;
            text-align:center;
            margin-top:2px;
        }
        .page-wrap{
            max-width:920px;
            margin:24px auto 48px;
            padding:0 18px;
        }
        .card{
            background:#ffffff;
            border-radius:24px;
            padding:32px 28px;
            box-shadow:0 10px 30px rgba(124, 58, 237, 0.08);
            border:1px solid #f1f5f9;
        }
        .form-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
        }
        .full-width{
            grid-column:1 / -1;
        }
        .form-group{
            display:flex;
            flex-direction:column;
            gap:8px;
        }
        label{
            font-size:14px;
            font-weight:600;
            color:#1e293b;
        }
        input, select, textarea{
            width:100%;
            border:2px solid #e2e8f0;
            border-radius:16px;
            padding:14px 16px;
            font-size:15px;
            background:#f8fafc;
            color:#0f172a;
            outline:none;
            transition:all .2s ease;
        }
        input:focus, select:focus, textarea:focus{
            border-color:#7c3aed;
            box-shadow:0 0 0 4px rgba(124, 58, 237, 0.12);
            background:#ffffff;
        }
        textarea{
            min-height:130px;
            resize:vertical;
        }
        .upload-field{
            background:#f5f3ff;
            border:2px dashed #cbd5e1;
            border-radius:20px;
            padding:20px;
        }
        .hint{
            font-size:13px;
            color:#64748b;
        }
        .image-preview{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(88px,1fr));
            gap:12px;
            margin-top:14px;
        }
        .preview-thumb{
            position:relative;
            overflow:hidden;
            border-radius:14px;
            background:#e2e8f0;
            height:88px;
        }
        .preview-thumb img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .preview-count{
            font-size:13px;
            font-weight:600;
            color:#6d28d9;
            margin-top:6px;
        }
        .submit-row{
            display:flex;
            flex-wrap:wrap;
            gap:16px;
            margin-top:28px;
            align-items:center;
            justify-content:space-between;
        }
        .publish-btn{
            background:linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
            color:#ffffff;
            border:none;
            border-radius:16px;
            padding:16px 32px;
            font-size:16px;
            font-weight:700;
            cursor:pointer;
            transition:all .2s ease;
            box-shadow:0 10px 24px rgba(124, 58, 237, 0.25);
            min-width:180px;
        }
        .publish-btn:hover{
            transform:translateY(-2px);
            box-shadow:0 14px 28px rgba(124, 58, 237, 0.35);
        }
        .status-message{
            flex:1;
            font-size:14px;
            font-weight:500;
            color:#475569;
        }
        @media (max-width:767px){
            .form-grid{
                grid-template-columns:1fr;
                gap:16px;
            }
            .card{
                padding:24px 18px;
            }
            .publish-btn{
                width:100%;
            }
        }
    </style>

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <button
            class="back-btn"
            onclick="history.back()"
            title="Back">

            ←

        </button>

        <div class="page-title">

            <h1>

                Post Your Mobile

            </h1>

            <p>

                Fill the details below

            </p>

        </div>

    </header>

    <!-- ================= POST FORM ================= -->

    <main class="page-wrap">

        <section class="card">

            <div class="form-grid">

                <div class="form-group upload-field full-width">

                    <label for="photos">

                        Upload Photos

                    </label>

                    <input
                        id="photos"
                        name="photos"
                        type="file"
                        multiple
                        accept="image/*">

                    <span class="hint">

                        Upload up to 10 images.

                    </span>

                    <div
                        class="image-preview"
                        id="imagePreview">

                    </div>

                    <div
                        class="preview-count"
                        id="previewCount">

                        0 / 10 images selected

                    </div>

                </div>

                <div class="form-group">

                    <label for="brand">

                        Mobile Brand

                    </label>

                    <input
                        id="brand"
                        name="brand"
                        type="text"
                        placeholder="Example: Samsung"
                        required>

                </div>
<!-- ===================================================== -->
<!--             SELLBY POST-MOBILE.HTML                  -->
<!--                   HTML PART 2                        -->
<!-- ===================================================== -->
<!--
    File Name : post-mobile.html
    Project   : SELLBY
    Mission   : Sell Easy. Buy Easy.
    Part      : 2
    Contains  :
    ✔ Mobile Model
    ✔ RAM
    ✔ Storage
    ✔ Condition
    ✔ Price
    ✔ Location
-->
<!-- ===================================================== -->

                <div class="form-group">

                    <label for="model">

                        Mobile Model

                    </label>

                    <input
                        id="model"
                        name="model"
                        type="text"
                        placeholder="Example: Galaxy S24"
                        required>

                </div>

                <div class="form-group">

                    <label for="ram">

                        RAM

                    </label>

                    <select
                        id="ram"
                        name="ram"
                        required>

                        <option value="">
                            Select RAM
                        </option>

                        <option>2 GB</option>
                        <option>3 GB</option>
                        <option>4 GB</option>
                        <option>6 GB</option>
                        <option>8 GB</option>
                        <option>12 GB</option>
                        <option>16 GB</option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="storage">

                        Storage

                    </label>

                    <select
                        id="storage"
                        name="storage"
                        required>

                        <option value="">
                            Select Storage
                        </option>

                        <option>32 GB</option>
                        <option>64 GB</option>
                        <option>128 GB</option>
                        <option>256 GB</option>
                        <option>512 GB</option>
                        <option>1 TB</option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="condition">

                        Condition

                    </label>

                    <select
                        id="condition"
                        name="condition"
                        required>

                        <option value="">
                            Select Condition
                        </option>

                        <option>New</option>

                        <option>Like New</option>

                        <option>Good</option>

                        <option>Used</option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="price">

                        Price

                    </label>

                    <input
                        id="price"
                        name="price"
                        type="number"
                        placeholder="Enter Price"
                        required>

                </div>

                <div class="form-group">

                    <label for="location">

                        Location

                    </label>

                    <input
                        id="location"
                        name="location"
                        type="text"
                        placeholder="City, Area or Landmark"
                        required>

                </div>
<!-- ===================================================== -->
<!--             SELLBY POST-MOBILE.HTML                  -->
<!--                   HTML PART 3                        -->
<!-- ===================================================== -->
<!--
    File Name : post-mobile.html
    Project   : SELLBY
    Mission   : Sell Easy. Buy Easy.
    Part      : 3
    Contains  :
    ✔ Description
    ✔ Contact Number
    ✔ WhatsApp Number
    ✔ Publish Button
    ✔ JavaScript Files
    ✔ Closing Body & HTML
-->
<!-- ===================================================== -->

                <div class="form-group full-width">

                    <label for="description">

                        Description

                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe your mobile..."
                        required></textarea>

                </div>

            </div>

            <div class="submit-row">

                <div
                    class="status-message"
                    id="statusMessage">

                    Fill all required fields before publishing your mobile.

                </div>

                <button
                    id="publishBtn"
                    class="publish-btn"
                    type="button">

                    Publish Mobile

                </button>

            </div>

        </section>

    </main>

    <!-- ================= FIREBASE ================= -->

    <script
        type="module"
        src="js/firebase-config.js">
    </script>

    <!-- ================= POST MOBILE ================= -->

    <script
        type="module"
        src="js/post-mobile.js">
    </script>

</body>

</html>
