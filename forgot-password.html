<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELLBY | Mobile Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="auth-page">
        <section class="auth-card">
            
            <!-- SELLBY BRAND LOGO & TAGLINE -->
            <header class="auth-header">
                <h1 class="auth-brand-logo">
                    <span class="logo-sell">SELL</span><span class="logo-by">BY</span>
                </h1>
                <p class="auth-tagline">
                    Sell Easy. Buy Easy.
                </p>
            </header>

            <div class="form-step">
                <h2 class="auth-card-title">Mobile Login Active</h2>
                <p class="auth-card-subtitle" style="margin-bottom: 24px;">
                    SELLBY now uses instant Mobile Number + OTP verification! Password resets are no longer needed.
                </p>

                <a href="login.html" class="gradient-btn" style="text-decoration: none;">
                    <span>Continue to Mobile Login</span>
                </a>
            </div>

        </section>
    </main>

</body>
</html>
