<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SELLBY | Forgot Password</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- ================= FORGOT PASSWORD CARD ================= -->

    <main class="auth-page">

        <section class="auth-card">

            <h1>

                Forgot Password

            </h1>

            <p>

                Enter your email to reset your password

            </p>

            <div class="form-group">

                <label for="email">

                    Email Address

                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your registered email"
                    required>

            </div>
<!-- ===================================================== -->
<!--          SELLBY FORGOT-PASSWORD.HTML                -->
<!--                   HTML PART 2                        -->
<!-- ===================================================== -->
<!--
    File Name : forgot-password.html
    Project   : SELLBY
    Mission   : Sell Easy. Buy Easy.
    Part      : 2
    Contains  :
    ✔ Reset Password Button
    ✔ Back to Login Link
-->
<!-- ===================================================== -->

            <button
                id="resetBtn"
                class="publish-btn"
                type="button">

                Send Reset Link

            </button>

            <p
                class="auth-footer">

                Remember your password?

                <a
                    href="login.html">

                    Login

                </a>

            </p>
<!-- ===================================================== -->
<!--          SELLBY FORGOT-PASSWORD.HTML                -->
<!--                   HTML PART 3                        -->
<!-- ===================================================== -->
<!--
    File Name : forgot-password.html

    Contains  :
    ✔ Status Message
    ✔ Firebase Script
    ✔ Forgot Password JavaScript
    ✔ Closing Body
    ✔ Closing HTML
-->
<!-- ===================================================== -->

            <p
                id="statusMessage"
                class="status-message">

            </p>

        </section>

    </main>

    <!-- ================= FIREBASE ================= -->

    <script
        type="module"
        src="js/firebase-config.js">
    </script>

    <!-- ================= FORGOT PASSWORD JS ================= -->

    <script
        type="module"
        src="js/forgot-password.js">
    </script>

</body>

</html>
