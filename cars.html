<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SELLBY | Cars</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <button
            class="back-btn"
            onclick="history.back()">

            ←

        </button>

        <div class="page-title">

            <h1>

                Cars

            </h1>

            <p>

                Buy & Sell Cars Easily

            </p>

        </div>

    </header>

    <!-- ================= SEARCH ================= -->

    <section class="search-section">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search Cars...">

            <button>

                🔍

            </button>

        </div>

    </section>

    <!-- ================= CAR LIST ================= -->

    <main class="cars-page">

        <div
            id="loadingMessage"
            class="loading-message">

            Loading cars...

        </div>

        <div
            id="carList"
            class="car-list">

        </div>
