<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SELLBY | Others</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"

          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"

    <!-- ================= HEADER ================= -->

    <header class="header">

        <button
            class="back-btn"

        </button>

        <div class="page-title">

            <h1>

                Others

            </h1>

            </p>

        </div>

    </header>

    <!-- ================= SEARCH ================= -->

    <section class="search-section">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search Items...">

            <button>

                🔍

            </button>

        </div>

    </section>

    <!-- ================= OTHERS LIST ================= -->

    <main class="cars-page">

        <div
            id="loadingMessage"
            class="loading-message">

            Loading items...

        </div>

        <div
            id="othersList"
            class="car-list">

        </div>
