<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SELLBY | Chat</title>

    <!-- ================= GOOGLE FONT ================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- ================= SELLBY CSS ================= -->

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <!-- ================================================= -->
    <!--                    CHAT HEADER                    -->
    <!-- ================================================= -->

    <header class="chat-header">

        <button
            class="back-btn"
            type="button"
            onclick="history.back()">

            ←

        </button>


        <div class="chat-user">

            <div class="chat-avatar">

                👤

            </div>


            <div>

                <h2 id="sellerName">

                    Seller

                </h2>


                <p id="sellerStatus">

                    🟢 Online

                </p>

            </div>

        </div>

    </header>


    <!-- ================================================= -->
    <!--                  CHAT MESSAGES                    -->
    <!-- ================================================= -->

    <main
        id="chatMessages"
        class="chat-messages">

    </main>


    <!-- ================================================= -->
    <!--                   CHAT FOOTER                     -->
    <!-- ================================================= -->

    <footer class="chat-footer">


        <!-- ================= EMOJI ================= -->

        <button
            id="emojiBtn"
            class="chat-icon-btn"
            type="button">

            😊

        </button>


        <!-- ================= IMAGE ================= -->

        <label
            for="chatImage"
            class="chat-icon-btn">

            📷

        </label>


        <input
            id="chatImage"
            type="file"
            accept="image/*"
            hidden>


        <!-- ================= MESSAGE INPUT ================= -->

        <input
            id="messageInput"
            class="chat-input"
            type="text"
            placeholder="Type a message..."
            autocomplete="off">


        <!-- ================= SEND ================= -->

        <button
            id="sendBtn"
            class="send-btn"
            type="button">

            ➤

        </button>

    </footer>


    <!-- ================================================= -->
    <!--                  FIREBASE CONFIG                  -->
    <!-- ================================================= -->

    <script
        type="module"
        src="js/firebase-config.js">
    </script>


    <!-- ================================================= -->
    <!--                     CHAT JS                       -->
    <!-- ================================================= -->

    <script
        type="module"
        src="js/chat.js">
    </script>


</body>

</html>
