<!-- ===================================================== -->
<!--                 SELLBY CHAT.HTML                      -->
<!--              BUYER ↔ SELLER CHAT PAGE                -->
<!-- ===================================================== -->

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SELLBY | Chat</title>

    <!-- ================= GOOGLE FONT ================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- ================= CHAT CSS ================= -->

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {

            background: #f5f7fb;

            display: flex;

            flex-direction: column;

            height: 100vh;

            overflow: hidden;

        }

        /* ================= CHAT HEADER ================= */

        .chat-header {

            height: 65px;

            min-height: 65px;

            background: #0057D9;

            color: #ffffff;

            display: flex;

            align-items: center;

            padding: 0 16px;

            gap: 15px;

            box-shadow: 0 2px 8px rgba(0,0,0,.12);

        }

        .back-btn {

            width: 42px;

            height: 42px;

            border: none;

            background: transparent;

            color: #ffffff;

            font-size: 28px;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

        }

        .chat-user {

            display: flex;

            align-items: center;

            gap: 10px;

        }

        .chat-avatar {

            width: 42px;

            height: 42px;

            border-radius: 50%;

            background: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

        }

        .chat-user h2 {

            font-size: 17px;

            font-weight: 600;

            line-height: 1.2;

        }

        .chat-user p {

            font-size: 11px;

            opacity: .9;

            margin-top: 2px;

        }

        /* ================= MESSAGE AREA ================= */

        .chat-messages {

            flex: 1;

            overflow-y: auto;

            padding: 15px;

            background: #eef3fb;

            display: flex;

            flex-direction: column;

            gap: 10px;

            scroll-behavior: smooth;

        }

        /* ================= MESSAGE BUBBLES ================= */

        .message {

            max-width: 80%;

            padding: 10px 13px;

            border-radius: 16px;

            font-size: 14px;

            line-height: 1.5;

            word-wrap: break-word;

            overflow-wrap: anywhere;

        }

        .sent {

            background: #0057D9;

            color: #ffffff;

            align-self: flex-end;

            border-bottom-right-radius: 5px;

        }

        .received {

            background: #ffffff;

            color: #222222;

            align-self: flex-start;

            border-bottom-left-radius: 5px;

            box-shadow: 0 2px 8px rgba(0,0,0,.08);

        }

        .message-text {

            white-space: pre-wrap;

        }

        .message-time {

            font-size: 9px;

            margin-top: 4px;

            opacity: .7;

            text-align: right;

        }

        /* ================= CHAT FOOTER ================= */

        .chat-footer {

            min-height: 68px;

            display: flex;

            align-items: center;

            gap: 8px;

            padding: 10px;

            background: #ffffff;

            border-top: 1px solid #dddddd;

        }

        .chat-icon-btn {

            width: 42px;

            height: 42px;

            min-width: 42px;

            border: none;

            background: #f1f3f6;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;

            cursor: pointer;

            user-select: none;

        }

        .chat-icon-btn:active {

            transform: scale(.94);

        }

        .chat-input {

            flex: 1;

            min-width: 0;

            height: 44px;

            padding: 0 16px;

            border: 1px solid #dddddd;

            border-radius: 25px;

            outline: none;

            font-size: 14px;

            background: #fafafa;

        }

        .chat-input:focus {

            border-color: #0057D9;

            background: #ffffff;

        }

        .send-btn {

            width: 46px;

            height: 46px;

            min-width: 46px;

            border: none;

            border-radius: 50%;

            background: #0057D9;

            color: #ffffff;

            font-size: 20px;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

        }

        .send-btn:active {

            transform: scale(.94);

        }

        .send-btn:disabled {

            opacity: .6;

            cursor: not-allowed;

        }

        /* ================= MOBILE ================= */

        @media (max-width: 480px) {

            .chat-header {

                height: 62px;

                min-height: 62px;

                padding: 0 10px;

            }

            .chat-messages {

                padding: 12px 10px;

            }

            .message {

                max-width: 84%;

                font-size: 14px;

            }

            .chat-footer {

                padding: 8px;

                gap: 6px;

            }

            .chat-icon-btn {

                width: 38px;

                height: 38px;

                min-width: 38px;

                font-size: 18px;

            }

            .send-btn {

                width: 42px;

                height: 42px;

                min-width: 42px;

            }

            .chat-input {

                height: 42px;

                padding: 0 13px;

            }

        }

    </style>

</head>


<body>


    <!-- ================================================= -->
    <!--                    CHAT HEADER                    -->
    <!-- ================================================= -->

    <header class="chat-header">

        <button
            class="back-btn"
            type="button"
            onclick="history.back()"
            aria-label="Go back"
        >

            ←

        </button>


        <div class="chat-user">

            <div class="chat-avatar">

                👤

            </div>


            <div>

                <h2 id="sellerName">

                    Seller

                </h2>


                <p id="sellerStatus">

                    🟢 Online

                </p>

            </div>

        </div>

    </header>



    <!-- ================================================= -->
    <!--                  CHAT MESSAGES                    -->
    <!-- ================================================= -->

    <main
        id="chatMessages"
        class="chat-messages"
    >

    </main>



    <!-- ================================================= -->
    <!--                    CHAT FOOTER                    -->
    <!-- ================================================= -->

    <footer class="chat-footer">


        <!-- ================= EMOJI ================= -->

        <button
            id="emojiBtn"
            class="chat-icon-btn"
            type="button"
            aria-label="Emoji"
        >

            😊

        </button>



        <!-- ================= IMAGE ================= -->

        <label
            for="chatImage"
            class="chat-icon-btn"
            aria-label="Upload image"
        >

            📷

        </label>


        <input
            id="chatImage"
            type="file"
            accept="image/*"
            hidden
        >



        <!-- ================= MESSAGE INPUT ================= -->

        <input
            id="messageInput"
            class="chat-input"
            type="text"
            autocomplete="off"
            placeholder="Type a message..."
        >



        <!-- ================= SEND ================= -->

        <button
            id="sendBtn"
            class="send-btn"
            type="button"
            aria-label="Send message"
        >

            ➤

        </button>


    </footer>



    <!-- ================================================= -->
    <!--                  FIREBASE CONFIG                  -->
    <!-- ================================================= -->

    <script
        type="module"
        src="./firebase-config.js"
    ></script>



    <!-- ================================================= -->
    <!--                     CHAT JS                       -->
    <!-- ================================================= -->

    <script
        type="module"
        src="./chat.js"
    ></script>



</body>

</html>
