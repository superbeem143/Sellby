<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SELLBY | Register</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- ================= REGISTER CARD ================= -->

    <main class="auth-page">

        <section class="auth-card">

            <h1>

                Create Account

            </h1>

            <p>

                Join SELLBY today

            </p>

            <div class="form-group">

                <label for="fullName">

                    Full Name

                </label>

                <input
                    id="fullName"
                    type="text"
                    placeholder="Enter your full name"
                    required>

            </div>

            <div class="form-group">

                <label for="email">

                    Email Address

                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    required>

            </div>
<!-- ===================================================== -->
<!--              SELLBY REGISTER.HTML                    -->
<!--                   HTML PART 2                        -->
<!-- ===================================================== -->
<!--
    File Name : register.html
    Project   : SELLBY
    Mission   : Sell Easy. Buy Easy.
    Part      : 2
    Contains  :
    ✔ Password
    ✔ Confirm Password
    ✔ Register Button
    ✔ Login Link
-->
<!-- ===================================================== -->

            <div class="form-group">

                <label for="password">

                    Password

                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Create a password"
                    required>

            </div>

            <div class="form-group">

                <label for="confirmPassword">

                    Confirm Password

                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm your password"
                    required>

            </div>

            <button
                id="registerBtn"
                class="publish-btn"
                type="button">

                Create Account

            </button>

            <p
                class="auth-footer">

                Already have an account?

                <a
                    href="login.html">

                    Login

                </a>

            </p>

    ✔ Closing HTML

<!-- ===================================================== -->

            <p
                id="statusMessage"
                class="status-message">

            </p>

        </section>

    </main>

    <!-- ================= FIREBASE ================= -->

    <script
        type="module"
        src="js/firebase-config.js">
    </script>

    <!-- ================= REGISTER JS ================= -->

    <script
        type="module"
        src="js/register.js">
    </script>

</body>

</html>
