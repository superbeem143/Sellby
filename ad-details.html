<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SELLBY | Ad Details</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        body {
            background: #f5f7fb;
            font-family: 'Poppins', sans-serif;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            min-height: 100vh;
        }

        #loading {
            padding: 40px;
            text-align: center;
            font-size: 18px;
            color: #666;
        }

        #error {
            display: none;
            padding: 40px;
            text-align: center;
            color: red;
            font-size: 18px;
        }

        #content {
            display: none;
        }

        .ad-image {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid #eee;
        }

        .details {
            padding: 25px;
        }

        .price {
            font-size: 32px;
            font-weight: 700;
            color: #0057D9;
            margin-top: 8px;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            margin-top: 8px;
        }

        .info {
            margin-top: 12px;
            font-size: 16px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .description {
            margin-top: 20px;
            line-height: 1.7;
            font-size: 15px;
            color: #333;
            white-space: pre-line;
        }

        .chat-btn {
            width: 100%;
            padding: 16px;
            background: #0057D9;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.2s;
        }

        .chat-btn:hover {
            background: #0044b3;
        }

    </style>

</head>

<body>

    <header class="header">

        <button
            class="back-btn"
            onclick="history.back()">

            ←

        </button>

        <div class="page-title">

            <h1>

                Ad Details

            </h1>

        </div>

    </header>

    <div class="container">

        <div id="loading">

            Loading Ad Details...

        </div>

        <div id="error"></div>

        <div id="content">

            <div id="imageSlider"></div>

            <div class="details">

                <div
                    class="price"
                    id="adPrice">

                </div>

                <div
                    class="title"
                    id="adTitle">

                </div>

                <div class="info">

                    📍
                    <span id="adLocation"></span>

                </div>

                <div class="info">

                    🏷️
                    <span id="adCategory"></span>

                </div>

                <div
                    class="description"
                    id="adDescription">

                </div>

                <div>

                    <button
                        id="chatBtn"
                        class="chat-btn">

                        💬 Chat with Seller

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- ================= FIREBASE ================= -->

    <script
        type="module"
        src="js/firebase-config.js">
    </script>

    <!-- ================= AD DETAILS JS ================= -->

    <script
        type="module"
        src="js/ad-details.js">
    </script>

</body>

</html>
