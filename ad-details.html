<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELLBY | Ad Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/auth-guard.js"></script>
    <style>
        .ad-details-page {
            padding-bottom: 40px;
        }
        .ad-details-card {
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.08);
            margin: 20px 16px;
        }
        .ad-main-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background: #f1f5f9;
        }
        .ad-info-box {
            padding: 24px;
        }
        .ad-price-tag {
            font-size: 28px;
            font-weight: 800;
            color: #6d28d9;
            margin-bottom: 8px;
        }
        .ad-title-text {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        .ad-meta-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .ad-desc-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin: 24px 0 10px;
        }
        .ad-desc-text {
            font-size: 15px;
            color: #475569;
            line-height: 1.6;
            white-space: pre-line;
        }
    </style>
</head>
<body>
    <header class="category-header">
        <button class="back-btn-small" onclick="history.back()">←</button>
        <div class="category-title-area">
            <h1 data-i18n="ad_details_title">Ad Details</h1>
        </div>
    </header>

    <main class="ad-details-page">
        <div id="loading" style="text-align: center; padding: 50px; color: #64748b;" data-i18n="loading">Loading Details...</div>
        <div id="error" style="display: none; text-align: center; padding: 50px; color: #dc2626;"></div>

        <div id="content" style="display: none;">
            <div class="ad-details-card">
                <div id="imageSlider"></div>
                <div class="ad-info-box">
                    <div class="ad-price-tag" id="adPrice"></div>
                    <h2 class="ad-title-text" id="adTitle"></h2>

                    <div class="ad-meta-row">
                        <span>📍</span>
                        <span id="adLocation"></span>
                    </div>
                    <div class="ad-meta-row">
                        <span>🏷️</span>
                        <span id="adCategory"></span>
                    </div>

                    <h3 class="ad-desc-title" data-i18n="description">Description</h3>
                    <p class="ad-desc-text" id="adDescription"></p>

                    <button id="chatBtn" class="publish-btn" style="margin-top: 30px;" data-i18n="chat_with_seller">
                        💬 Chat with Seller
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/ad-details.js"></script>
</body>
</html>
