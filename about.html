        .category-header {
            position: sticky;
            top: 0;
            z-index: 100;

            width: 100%;
            min-height: 68px;

            display: flex;
            align-items: center;

            background: linear-gradient(

        }

            font-size: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .back-btn-small:active {
            transform: scale(0.95);
        }

        .category-title-area {
            min-width: 0;
            padding-left: 12px;
        }

        .category-title-area h1 {
            margin: 0;

            color: #ffffff;

            font-size: 17px;
            line-height: 1.25;

            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
