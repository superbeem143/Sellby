<!-- ===================================================== -->
<!--                 SELLBY CHAT.HTML                      -->
<!--                     HTML PART 1                       -->
<!-- ===================================================== -->

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SELLBY Chat</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:#f5f7fb;

display:flex;

flex-direction:column;

height:100vh;

}

.header{

height:65px;

background:#0057D9;

color:#fff;

display:flex;

align-items:center;

padding:0 16px;

gap:15px;

}

.back{

font-size:24px;

cursor:pointer;

}

.user{

display:flex;

flex-direction:column;

}

.user h2{

font-size:18px;

font-weight:600;

}

.user p{

font-size:12px;

opacity:.9;

}

.chat-area{

flex:1;

overflow-y:auto;

padding:15px;

background:#eef3fb;

display:flex;

flex-direction:column;

gap:12px;

}

</style>

</head>

<body>

<div class="header">

<div
class="back"
onclick="history.back()">

←

</div>

<div class="user">

<h2 id="sellerName">

Seller

</h2>

<p id="sellerStatus">

Online

</p>

</div>

</div>

<div
id="chatMessages"
class="chat-area">

</div>
<!-- ===================================================== -->
<!--                 SELLBY CHAT.HTML                      -->
<!--                     HTML PART 2                       -->
<!-- ===================================================== -->

<style>

.message{

max-width:80%;

padding:12px 15px;

border-radius:16px;

font-size:15px;

line-height:1.5;

word-wrap:break-word;

}

.sent{

background:#0057D9;

color:#fff;

align-self:flex-end;

border-bottom-right-radius:5px;

}

.received{

background:#fff;

color:#222;

align-self:flex-start;

border-bottom-left-radius:5px;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}

.input-area{

display:flex;

gap:10px;

padding:12px;

background:#fff;

border-top:1px solid #ddd;

}

.input-area input{

flex:1;

padding:14px;

border:1px solid #ddd;

border-radius:30px;

outline:none;

font-size:15px;

}

.input-area button{

background:#0057D9;

color:#fff;

border:none;

padding:0 22px;

border-radius:30px;

font-size:16px;

font-weight:600;

cursor:pointer;

}

</style>

<div class="input-area">

<input

id="messageInput"

type="text"

placeholder="Type your message...">

<button

id="sendBtn">

Send

</button>

</div>
<!-- ===================================================== -->
<!--                 SELLBY CHAT.HTML                      -->
<!--                     HTML PART 3                       -->
<!-- ===================================================== -->

<script type="module" src="./js/firebase-config.js"></script>

<script type="module" src="./js/chat.js"></script>

</body>

</html>
