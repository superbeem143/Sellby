<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

SELLBY Chat

</title>

<link
rel="stylesheet"
href="css/style.css">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Poppins,sans-serif;

}

body{

background:#f5f5f5;

height:100vh;

display:flex;

flex-direction:column;

}

header{

height:65px;

background:#0057D9;

color:#fff;

display:flex;

align-items:center;

padding:0 16px;

gap:15px;

}

.back-btn{

font-size:28px;

cursor:pointer;

}

.chat-user{

display:flex;

flex-direction:column;

}

.chat-user h2{

font-size:18px;

}

.chat-user p{

font-size:13px;

opacity:.9;

}

#messages{

flex:1;

overflow-y:auto;

padding:15px;

display:flex;

flex-direction:column;

gap:12px;

background:#ECEFF1;

}

</style>

</head>

<body>

<header>

<div
class="back-btn"
onclick="history.back()">

←

</div>

<div
class="chat-user">

<h2
id="sellerName">

Seller

</h2>

<p>

SELLBY Chat

</p>

</div>

</header>

<div
id="messages">

</div>
<!-- ===================================================== -->
<!--                 SELLBY CHAT.HTML                      -->
<!--                    HTML PART 2                        -->
<!-- ===================================================== -->

<div
class="chat-input">

<input

type="text"

id="messageInput"

placeholder="Type your message...">

<button

id="sendBtn">

Send

</button>

</div>

<style>

.chat-input{

display:flex;

padding:12px;

background:#fff;

border-top:1px solid #ddd;

gap:10px;

}

.chat-input input{

flex:1;

padding:14px;

border:1px solid #ccc;

border-radius:25px;

outline:none;

font-size:16px;

}

.chat-input button{

background:#0057D9;

color:#fff;

border:none;

padding:0 22px;

border-radius:25px;

cursor:pointer;

font-size:16px;

font-weight:600;

transition:.2s;

}

.chat-input button:hover{

background:#0044aa;

}

.message{

max-width:75%;

padding:12px;

border-radius:14px;

word-break:break-word;

}

.sent{

align-self:flex-end;

background:#0057D9;

color:#fff;

}

.received{

align-self:flex-start;

background:#fff;

color:#222;

border:1px solid #ddd;

}

</style>
<!-- ===================================================== -->
<!--                 SELLBY CHAT.HTML                      -->
<!--                    HTML PART 3                        -->
<!-- ===================================================== -->

<script
type="module"
src="./js/chat.js">
</script>

</body>

</html>
