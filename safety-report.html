<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>SELLBY | Safety & Report</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <!-- EXISTING AUTH GUARD — PRESERVED -->
    <script type="module" src="js/auth-guard.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #f7f8fc;
            color: #172033;
        }

        /* =========================
           HEADER
           ========================= */

        .category-header {
            position: sticky;
            top: 0;
            z-index: 100;

            width: 100%;
            min-height: 68px;

            display: flex;
            align-items: center;

            padding: 10px 14px;

            background: linear-gradient(
                135deg,
                #7c3aed 0%,
                #a832d4 50%,
                #d51f7a 100%
            );

            box-shadow:
                0 5px 18px rgba(124, 58, 237, 0.18);
        }

        .back-btn-small {
            flex: 0 0 44px;

            width: 44px;
            height: 44px;

            border: 0;
            border-radius: 13px;

            background: rgba(255, 255, 255, 0.16);

            color: #fff;

            font-size: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .back-btn-small:active {
            transform: scale(0.95);
        }

        .category-title-area {
            min-width: 0;
            padding-left: 12px;
        }

        .category-title-area h1 {
            margin: 0;

            color: #fff;

            font-size: 17px;
            line-height: 1.25;

            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .category-title-area p {
            margin: 2px 0 0;

            color: rgba(255, 255, 255, 0.78);

            font-size: 9px;
            line-height: 1.3;
        }

        /* =========================
           MAIN
           ========================= */

        .safety-content {
            width: 100%;
            max-width: 760px;

            margin: 0 auto;

            padding: 18px 14px 45px;
        }

        /* =========================
           HERO
           ========================= */

        .safety-hero {
            padding: 25px 18px;

            border-radius: 21px;

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    rgba(124, 58, 237, 0.10),
                    rgba(213, 31, 122, 0.08)
                );

            border: 1px solid rgba(124, 58, 237, 0.10);

            box-shadow:
                0 5px 18px rgba(20, 30, 55, 0.035);
        }

        .safety-icon {
            width: 54px;
            height: 54px;

            margin: 0 auto 12px;

            border-radius: 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #d51f7a
            );

            color: #fff;

            font-size: 26px;

            box-shadow:
                0 7px 18px rgba(124, 58, 237, 0.22);
        }

        .safety-hero h2 {
            margin: 0;

            color: #172033;

            font-size: 18px;
            font-weight: 700;
        }

        .safety-hero p {
            margin: 7px 0 0;

            color: #64748b;

            font-size: 11px;
            line-height: 1.6;
        }

        /* =========================
           SAFETY INTRO
           ========================= */

        .safety-intro {
            margin: 16px 0 0;

            padding: 17px;

            background: #fff;

            border: 1px solid #edf0f5;

            border-radius: 18px;

            color: #475569;

            font-size: 12px;
            line-height: 1.75;

            box-shadow:
                0 5px 18px rgba(20, 30, 55, 0.045);
        }

        /* =========================
           SAFETY CARDS
           ========================= */

        .safety-card {
            position: relative;

            margin-top: 13px;

            padding: 17px 16px 17px 20px;

            background: #fff;

            border-radius: 18px;

            border: 1px solid #edf0f5;

            box-shadow:
                0 5px 18px rgba(20, 30, 55, 0.045);

            overflow: hidden;
        }

        .safety-card::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 4px;

            background: linear-gradient(
                180deg,
                #7c3aed,
                #d51f7a
            );
        }

        .safety-card h3 {
            margin: 0 0 7px;

            color: #4c1d95;

            font-size: 14px;
            font-weight: 700;
        }

        .safety-card p {
            margin: 0;

            color: #64748b;

            font-size: 11px;
            line-height: 1.7;
        }

        /* =========================
           REPORT BOX
           ========================= */

        .report-box {
            margin-top: 18px;

            padding: 19px 16px;

            background: #fff;

            border-radius: 20px;

            border: 1px solid #fee2e2;

            box-shadow:
                0 5px 18px rgba(20, 30, 55, 0.045);
        }

        .report-box h3 {
            margin: 0 0 7px;

            color: #991b1b;

            font-size: 15px;
            font-weight: 700;
        }

        .report-box p {
            margin: 0;

            color: #64748b;

            font-size: 11px;
            line-height: 1.7;
        }

        /* =========================
           REPORT BUTTON
           ========================= */

        .report-btn {
            display: flex;

            width: 100%;
            min-height: 50px;

            margin-top: 15px;

            align-items: center;
            justify-content: center;

            padding: 13px 16px;

            background:
                linear-gradient(
                    135deg,
                    #fff1f2,
                    #fef2f2
                );

            color: #dc2626;

            text-align: center;

            border-radius: 15px;

            font-family: inherit;

            font-size: 12px;
            font-weight: 700;

            text-decoration: none;

            border: 1px solid #fecaca;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .report-btn:active {
            transform: scale(0.98);
        }

        /* =========================
           FOOTER
           ========================= */

        .safety-footer {
            padding: 20px 5px 5px;

            text-align: center;
        }

        .safety-footer p {
            margin: 0;

            color: #94a3b8;

            font-size: 9px;
        }

        /* =========================
           SMALL ANDROID
           ========================= */

        @media (max-width: 380px) {

            .category-header {
                min-height: 64px;
                padding: 8px 10px;
            }

            .back-btn-small {
                width: 40px;
                height: 40px;
                flex-basis: 40px;
            }

            .category
