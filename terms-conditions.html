<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELLBY | Terms & Conditions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/auth-guard.js"></script>
    <style>
        .legal-content { padding: 24px 18px; line-height: 1.7; color: #334155; }
        .legal-content h2 { font-size: 18px; font-weight: 700; margin: 20px 0 10px; color: #1e293b; }
        .legal-content p { font-size: 14px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <header class="category-header">
        <button class="back-btn-small" id="backBtn" onclick="history.back()">←</button>
        <div class="category-title-area">
            <h1 id="pageTitle" data-i18n="terms_conditions">Terms & Conditions</h1>
            <p id="pageSubtitle" data-i18n="app_name">Usage Guidelines</p>
        </div>
    </header>

    <main class="legal-content" id="mainContent">
        <p data-i18n="terms_text"></p>
    </main>

    <script type="module">
        import { initTranslations } from "./js/i18n.js";

        document.addEventListener('DOMContentLoaded', () => {
            initTranslations();
        });
    </script>
</body>
</html>
